name: Vigilancia de Supabase

# Todos los días consulta los proyectos de Supabase (plan gratis) para que no
# se pausen por inactividad y para avisar si alguno dejó de responder.
# Si falla, GitHub le envía un correo al dueño del repositorio.
# Requiere los secretos del despliegue y, para el módulo de Feedbacks:
#   DEMO_SUPABASE_URL, DEMO_SUPABASE_PUBLISHABLE_KEY

on:
  schedule:
    - cron: "17 11 * * *" # 6:17 a. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar los proyectos
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          DEMO_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          DEMO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEMO_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/vigilancia.mjs
