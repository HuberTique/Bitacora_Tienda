async function generarPdfPlanTrabajo(pt){
  if(!window.PDFLib){ alert("No se pudo cargar el generador de PDF. Intenta de nuevo."); return; }
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const pdfDoc = await PDFDocument.create();
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const black = rgb(0.1,0.1,0.1);
  const lineColor = rgb(0.75,0.75,0.75);
  const logoBytes = Uint8Array.from(atob(LOGO_PLAN_TRABAJO_B64), c=>c.charCodeAt(0));
  const logoImg = await pdfDoc.embedPng(logoBytes);
  const toPdfY = (fitzY)=> PT_PAGE_H - fitzY;

  let page = pdfDoc.addPage([PT_PAGE_W, PT_PAGE_H]);

  function drawText(text, x, yBaseline, opts={}){
    if(!text) return;
    page.drawText(String(text), {x, y:toPdfY(yBaseline), size:opts.size||10, font:opts.bold?fontBold:font, color:opts.color||black});
  }
  function drawWrapped(text, box){
    if(!text) return;
    const f = box.bold?fontBold:font;
    const words = String(text).split(/\s+/).filter(Boolean);
    let lines=[], cur="";
    words.forEach(w=>{
      const test = cur? cur+" "+w : w;
      if(f.widthOfTextAtSize(test, box.fontSize) > box.maxWidth && cur){ lines.push(cur); cur=w; } else cur = test;
    });
    if(cur) lines.push(cur);
    lines.forEach((line,i)=>{
      const fitzLineY = box.yTop + box.fontSize + i*box.lineHeight;
      if(box.yBottom!=null && fitzLineY > box.yBottom) return; // no desbordar la tabla
      page.drawText(line, {x:box.x, y:toPdfY(fitzLineY), size:box.fontSize, font:f, color:black});
    });
  }
  function drawTableGrid(x0,x1,yTop,yBottom,rowHeight,colDividerX){
    let y = yTop;
    while(y <= yBottom+0.5){
      page.drawLine({start:{x:x0,y:toPdfY(y)}, end:{x:x1,y:toPdfY(y)}, thickness:0.75, color:lineColor});
      y += rowHeight;
    }
    page.drawLine({start:{x:x0,y:toPdfY(yTop)}, end:{x:x0,y:toPdfY(yBottom)}, thickness:0.75, color:lineColor});
    page.drawLine({start:{x:x1,y:toPdfY(yTop)}, end:{x:x1,y:toPdfY(yBottom)}, thickness:0.75, color:lineColor});
    if(colDividerX) page.drawLine({start:{x:colDividerX,y:toPdfY(yTop)}, end:{x:colDividerX,y:toPdfY(yBottom)}, thickness:0.75, color:lineColor});
  }
  function drawDosColumnas(filas, x0, yTop, rowHeight, maxRows, colDividerX){
    (filas||[]).slice(0,maxRows).forEach((f,i)=>{
      const rowYTop = yTop + i*rowHeight;
      drawWrapped(f.texto, {x:x0+6, yTop:rowYTop+2, yBottom:rowYTop+rowHeight, maxWidth:colDividerX-x0-12, fontSize:9, lineHeight:10.5});
      if(f.fecha) page.drawText(String(f.fecha), {x:colDividerX+8, y:toPdfY(rowYTop+12), size:9, font, color:black});
    });
  }

  // ===== PÁGINA 1 =====
  const logoDims = logoImg.scale(145.5/logoImg.width);
  page.drawImage(logoImg, {x:85, y:toPdfY(70.8)-logoDims.height, width:145.5, height:logoDims.height});
  page.drawText("PLAN DE TRABAJO", {x:214.5, y:toPdfY(122), size:16, font:fontBold, color:black});
  drawWrapped("Utilice este formulario para dejar constancia de un Plan de Trabajo realizado con la tienda en general o con cualquier empleado en particular. También puede ser usado para plasmar compromisos a realizar en un plazo determinado.",
    {x:85.15, yTop:133, maxWidth:442, fontSize:9.5, lineHeight:13.35});

  drawText("1. Especifique el(los) responsable(s) de ejecutar el Plan de Trabajo", 85.15, 219, {size:10, bold:true});
  drawTableGrid(85.3, 526.7, 234.8, 307.8, 14.6);
  drawWrapped(pt.responsables, {x:90.8, yTop:239, yBottom:307.8, maxWidth:430, fontSize:9.5, lineHeight:14.5});

  drawWrapped("2. Especifique el Plan de Trabajo a seguir por el trabajador o la tienda en general.",
    {x:85.15, yTop:332, maxWidth:442, fontSize:10, lineHeight:16.1, bold:true});
  drawTableGrid(85.3, 526.7, 372.1, 517.6, 14.55);
  drawWrapped(pt.planTrabajo, {x:90.8, yTop:376, yBottom:517.6, maxWidth:430, fontSize:9.5, lineHeight:13.2});

  drawWrapped("3. Especifique compromisos de ejecución de tareas con sus plazos y fechas respectivas.",
    {x:85.15, yTop:542, maxWidth:442, fontSize:10, lineHeight:16.1, bold:true});
  drawTableGrid(85.3, 526.7, 582.2, 703.0, 15.05, 425.3);
  drawText("COMPROMISOS", 90.8, 592.5, {size:9.5, bold:true});
  drawText("FECHA", 430.75, 592.5, {size:9.5, bold:true});
  drawDosColumnas(pt.compromisos, 85.3, 597.2, 15.05, 7, 425.3);

  // ===== PÁGINA 2 =====
  page = pdfDoc.addPage([PT_PAGE_W, PT_PAGE_H]);
  drawWrapped("4. Especifique responsabilidades del Jefe directo (DSM o Jefe de Tienda) para el logro del plan de trabajo acordado. Indique compromisos, capacitaciones y/o fechas de trabajo en conjunto",
    {x:85.15, yTop:70.9, maxWidth:442, fontSize:10, lineHeight:16.1, bold:true});
  drawTableGrid(85.3, 526.7, 127.2, 248.5, 15.05, 425.3);
  drawText("RESPONSABILIDADES / ACUERDOS", 90.8, 137.9, {size:9.5, bold:true});
  drawText("FECHA", 430.75, 137.9, {size:9.5, bold:true});
  drawDosColumnas(pt.responsabilidadesJefe, 85.3, 142.5, 15.05, 7, 425.3);

  drawWrapped("5. Indique cualquier otro comentario relevante. En este caso si utiliza algún documento para apoyar este plan de trabajo, tome una foto como respaldo.",
    {x:85.15, yTop:272.6, maxWidth:442, fontSize:10, lineHeight:16.1, bold:true});
  drawTableGrid(85.3, 526.7, 328.9, 445.4, 14.5);
  drawWrapped(pt.comentario, {x:90.8, yTop:333, yBottom:445.4, maxWidth:430, fontSize:9.5, lineHeight:13.5});

  drawText("6. Comente compromisos del trabajador o la tienda acordados.", 85.15, 479, {size:10, bold:true});
  drawTableGrid(85.3, 526.7, 493.6, 581.1, 14.5);
  drawWrapped(pt.compromisosTrabajador, {x:90.8, yTop:497.5, yBottom:581.1, maxWidth:430, fontSize:9.5, lineHeight:13.5});

  function drawLabelValor(label, valor, x, yBaseline, size){
    page.drawText(label, {x, y:toPdfY(yBaseline), size, font, color:black});
    const w = font.widthOfTextAtSize(label+" ", size);
    if(valor) page.drawText(String(valor), {x:x+w, y:toPdfY(yBaseline), size, font:fontBold, color:black});
  }
  drawLabelValor("NOMBRE DE QUIÉN REALIZA FEEDBACK:", pt.nombreJefatura, 85.15, 612, 10);
  drawLabelValor("CARGO DE QUIÉN REALIZA FEEDBACK:", pt.cargoJefatura, 85.15, 632, 10);
  drawLabelValor("FIRMA DE QUIEN REALIZA FEEDBACK:", pt.nombreJefatura, 85.15, 652, 10);
  drawLabelValor("FIRMA DE RESPONSABLE(S):", pt.responsables, 85.15, 672, 10);
  drawLabelValor("FECHA:", fmtDate(pt.fecha), 419.45, 693, 10);

  const outBytes = await pdfDoc.save();
  const blob = new Blob([outBytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `PlanDeTrabajo_${(pt.responsables||"equipo").replace(/[^a-zA-Z0-9]+/g,"_").slice(0,40)}_${pt.fecha}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ======================= REQUERIMIENTOS (Calendario, Jefatura + Asesor) ======================= */
const TIPOS_REQUERIMIENTO = [
  {id:"dia_libre", label:"Día libre"},
  {id:"salida_temprano", label:"Salida temprano"},
  {id:"permiso", label:"Permiso / llegada tarde autorizada"},
  {id:"otro", label:"Otro"},
];
let calAnio = new Date().getFullYear();
let calMes = new Date().getMonth()+1; // 1-12

function tipoRequerimiento(id){ return TIPOS_REQUERIMIENTO.find(t=>t.id===id) || TIPOS_REQUERIMIENTO[TIPOS_REQUERIMIENTO.length-1]; }
function diaBloqueado(fecha){ return STATE.diasBloqueados.find(b=>b.fecha===fecha); }
function requerimientosDelDia(fecha){ return STATE.requerimientos.filter(r=>r.fecha===fecha); }

function renderRequerimientos(main){
  main.innerHTML = `
    <div class="main-header">
      <div><h2>Requerimientos</h2><p>${session.rol==='jefatura'
        ? 'Calendario de requerimientos de todo el equipo (días libres, salidas temprano, permisos). Sirve de referencia al generar los horarios en Configuración.'
        : 'Registra aquí tus requerimientos (día libre, salida temprano, permisos) para que jefatura los tenga en cuenta al armar el horario.'}</p></div>
    </div>
    <div class="card">
      <div class="cal-header">
        <div class="cal-nav">
          <button class="btn-sm" id="calPrev">‹</button>
          <h3>${MESES[calMes-1]} ${calAnio}</h3>
          <button class="btn-sm" id="calNext">›</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;">
          <span><span class="cal-chip tipo-dia_libre" style="padding:2px 8px;">&nbsp;</span> Día libre</span>
          <span><span class="cal-chip tipo-salida_temprano" style="padding:2px 8px;">&nbsp;</span> Salida temprano</span>
          <span><span class="cal-chip tipo-permiso" style="padding:2px 8px;">&nbsp;</span> Permiso</span>
          <span><span class="cal-chip tipo-otro" style="padding:2px 8px;">&nbsp;</span> Otro</span>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  `;
  document.getElementById("calPrev").addEventListener("click", ()=>{
    calMes--; if(calMes<1){ calMes=12; calAnio--; }
    renderRequerimientos(main);
  });
  document.getElementById("calNext").addEventListener("click", ()=>{
    calMes++; if(calMes>12){ calMes=1; calAnio++; }
    renderRequerimientos(main);
  });
  drawCalendario();
}

function drawCalendario(){
  const grid = document.getElementById("calGrid");
  const primerDia = new Date(calAnio, calMes-1, 1);
  const diasEnMes = new Date(calAnio, calMes, 0).getDate();
  const offsetInicio = (primerDia.getDay()+6)%7; // que la semana empiece en lunes
  const hoyStr = todayStr();

  let celdas = "";
  celdas += ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>`<div class="cal-daylabel">${d}</div>`).join("");
  // días vacíos antes del 1
  for(let i=0;i<offsetInicio;i++) celdas += `<div class="cal-day other-month"></div>`;

  for(let d=1; d<=diasEnMes; d++){
    const fecha = `${calAnio}-${String(calMes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bloqueado = diaBloqueado(fecha);
    let reqs = requerimientosDelDia(fecha);
    if(session.rol!=="jefatura") reqs = reqs.filter(r=>r.persona===session.nombre);
    const visibles = reqs.slice(0,3);
    const extra = reqs.length - visibles.length;
    celdas += `
      <div class="cal-day ${bloqueado?'blocked':''} ${fecha===hoyStr?'today':''}" data-fecha="${fecha}">
        <div class="cal-daynum"><span>${d}</span>${bloqueado?'<span class="blk-tag">Bloqueado</span>':''}</div>
        ${visibles.map(r=>`<div class="cal-chip tipo-${r.tipo}">${session.rol==='jefatura'?escapeHtml(r.persona.split(' ')[0])+': ':''}${escapeHtml(tipoRequerimiento(r.tipo).label)}</div>`).join("")}
        ${extra>0?`<div class="cal-more">+${extra} más</div>`:""}
      </div>`;
  }
  grid.innerHTML = celdas;
  grid.querySelectorAll(".cal-day[data-fecha]").forEach(el=>{
    el.addEventListener("click", ()=> abrirDiaRequerimiento(el.dataset.fecha));
  });
}

function abrirDiaRequerimiento(fecha){
  const bloqueado = diaBloqueado(fecha);
  const reqs = requerimientosDelDia(fecha).sort((a,b)=>a.fechaRegistro.localeCompare(b.fechaRegistro));
  const puedeAgregar = !bloqueado;

  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>${fmtDate(fecha)}</h3>
    ${bloqueado ? `<div class="login-error" style="display:block;">Día bloqueado por jefatura: ${escapeHtml(bloqueado.motivo||'sin motivo especificado')}</div>` : ""}
    ${session.rol==='jefatura' ? `
      <button class="btn-sm" id="btnToggleBloqueo" style="margin-bottom:12px;">${bloqueado ? 'Desbloquear este día' : 'Bloquear este día'}</button>
    ` : ""}
    <div id="reqListWrap">
      ${reqs.length===0 ? `<div class="empty">Sin requerimientos registrados para este día.</div>` : reqs.map(r=>`
        <div class="pendiente-row">
          <div class="top">
            <span class="cal-chip tipo-${r.tipo}">${escapeHtml(tipoRequerimiento(r.tipo).label)}</span>
            <span class="estado-tag ${r.estado==='aprobado'?'activo':r.estado==='rechazado'?'inactivo':'progreso'}">${r.estado==='aprobado'?'Aprobado':r.estado==='rechazado'?'Rechazado':'Pendiente de revisión'}</span>
          </div>
          <div class="titulo" style="margin-top:6px;">${escapeHtml(r.persona)}</div>
          ${r.detalle ? `<div class="desc">${escapeHtml(r.detalle)}</div>` : ""}
          ${r.evidencia ? `
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              <span class="stamp">📎 ${escapeHtml(r.evidencia.nombre||'anexo')}</span>
              <button class="btn-sm" data-action="descpdf" data-id="${r.id}">Descargar como PDF</button>
              <button class="btn-sm" data-action="descorig" data-id="${r.id}">Descargar original</button>
            </div>
          ` : ""}
          <div class="req-audit">Registrado por <strong>${escapeHtml(r.registradoPor)}</strong> el ${fmtDate(r.fechaRegistro)}${r.revisadoPor?` · ${r.estado==='aprobado'?'Aprobado':'Rechazado'} por ${escapeHtml(r.revisadoPor)} el ${fmtDate(r.fechaRevision)}`:""}</div>
          <div style="margin-top:8px;display:flex;gap:6px;">
            ${session.rol==='jefatura' && r.persona!==session.nombre && r.estado==='pendiente' ? `
              <button class="btn-sm" data-action="aprobar" data-id="${r.id}" style="color:#1F8A70;border-color:#BEE7D6;">Aprobar</button>
              <button class="btn-sm" data-action="rechazar" data-id="${r.id}" style="color:var(--warn);border-color:#F0C4B8;">Rechazar</button>
            ` : ""}
            ${(session.rol==='jefatura' || r.registradoPor===session.nombre) ? `<button class="btn-sm danger" data-action="delreq" data-id="${r.id}">Eliminar</button>` : ""}
          </div>
        </div>
      `).join("")}
    </div>
    ${puedeAgregar ? `
      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;">
        <label style="font-size:11.5px;color:var(--muted);text-transform:uppercase;">Nuevo requerimiento</label>
        <div class="form-grid" style="margin-top:8px;">
          ${session.rol==='jefatura' ? `
            <div class="full"><label>Persona</label><select id="reqPersona">${activeRoster().map(p=>`<option value="${escapeHtml(p.nombre)}" ${p.nombre===session.nombre?'selected':''}>${escapeHtml(p.nombre)}</option>`).join("")}</select></div>
          ` : ""}
          <div class="full"><label>Tipo</label><select id="reqTipo">${TIPOS_REQUERIMIENTO.map(t=>`<option value="${t.id}">${t.label}</option>`).join("")}</select></div>
          <div class="full"><label>Detalle (opcional)</label><textarea id="reqDetalle" placeholder="Ej: salida a las 5pm por cita médica..."></textarea></div>
          <div class="full">
            <label>Anexos (opcional) — ej. certificado, constancia</label>
            <div class="file-drop" id="reqAnexoDrop">Haz clic para adjuntar una imagen o PDF</div>
            <input type="file" id="reqAnexoFile" accept="image/*,application/pdf" style="display:none">
            <div id="reqAnexoNombre" style="font-size:12px;color:var(--muted);margin-top:6px;"></div>
          </div>
        </div>
        <button class="btn-primary" style="margin-top:12px;max-width:200px;" id="btnGuardarReq">Guardar requerimiento</button>
      </div>
    ` : (session.rol!=='jefatura' ? `<div class="empty" style="margin-top:14px;">Jefatura bloqueó este día — no se pueden agregar nuevos requerimientos.</div>` : "")}
  `, true);

  if(session.rol==='jefatura'){
    document.getElementById("btnToggleBloqueo").addEventListener("click", async ()=>{
      if(bloqueado){
        STATE.diasBloqueados = STATE.diasBloqueados.filter(b=>b.fecha!==fecha);
      } else {
        const motivo = prompt("Motivo del bloqueo (opcional):") || "";
        STATE.diasBloqueados.push({id:uid(), fecha, motivo, creadoPor:session.nombre});
      }
      await saveState("diasBloqueados");
      closeModal();
      abrirDiaRequerimiento(fecha);
      drawCalendario();
    });
  }

  document.querySelectorAll("[data-action='delreq']").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm("¿Eliminar este requerimiento?")) return;
      STATE.requerimientos = STATE.requerimientos.filter(r=>r.id!==btn.dataset.id);
      await saveState("requerimientos");
      closeModal();
      abrirDiaRequerimiento(fecha);
      drawCalendario();
    });
  });
  document.querySelectorAll("[data-action='descpdf']").forEach(btn=>{
    btn.addEventListener("click", ()=> descargarEvidenciaComoPDF(btn.dataset.id));
  });
  document.querySelectorAll("[data-action='descorig']").forEach(btn=>{
    btn.addEventListener("click", ()=> descargarEvidenciaOriginal(btn.dataset.id));
  });
  document.querySelectorAll("[data-action='aprobar']").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const r = STATE.requerimientos.find(x=>x.id===btn.dataset.id);
      r.estado = "aprobado"; r.revisadoPor = session.nombre; r.fechaRevision = todayStr();
      await saveState("requerimientos");
      await crearNotificacion({
        tipo:"requerimiento_aprobado", destinatario:r.persona, refFecha:r.fecha,
        mensaje:`Tu requerimiento de "${tipoRequerimiento(r.tipo).label}" para el ${fmtDate(r.fecha)} fue aprobado por ${session.nombre}.`,
      });
      closeModal();
      abrirDiaRequerimiento(fecha);
      drawCalendario();
    });
  });
  document.querySelectorAll("[data-action='rechazar']").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const r = STATE.requerimientos.find(x=>x.id===btn.dataset.id);
      r.estado = "rechazado"; r.revisadoPor = session.nombre; r.fechaRevision = todayStr();
      await saveState("requerimientos");
      await crearNotificacion({
        tipo:"requerimiento_rechazado", destinatario:r.persona, refFecha:r.fecha,
        mensaje:`Tu requerimiento de "${tipoRequerimiento(r.tipo).label}" para el ${fmtDate(r.fecha)} fue rechazado por ${session.nombre}.`,
      });
      closeModal();
      abrirDiaRequerimiento(fecha);
      drawCalendario();
    });
  });

  let anexoData = null, anexoMime = null, anexoNombre = null;
  const anexoDrop = document.getElementById("reqAnexoDrop");
  if(anexoDrop){
    anexoDrop.addEventListener("click", ()=> document.getElementById("reqAnexoFile").click());
    document.getElementById("reqAnexoFile").addEventListener("change", async (e)=>{
      const f = e.target.files[0]; if(!f) return;
      anexoData = await fileToBase64(f);
      anexoMime = f.type || "application/octet-stream";
      anexoNombre = f.name;
      document.getElementById("reqAnexoNombre").textContent = "Adjunto: " + f.name;
    });
  }

  const btnGuardar = document.getElementById("btnGuardarReq");
  if(btnGuardar){
    btnGuardar.addEventListener("click", async ()=>{
      // se vuelve a validar el bloqueo justo antes de guardar, respetando los parámetros de jefatura
      if(diaBloqueado(fecha)){ alert("Este día fue bloqueado por jefatura. No se puede agregar el requerimiento."); return; }
      const persona = session.rol==='jefatura' ? document.getElementById("reqPersona").value : session.nombre;
      const tipo = document.getElementById("reqTipo").value;
      const detalle = document.getElementById("reqDetalle").value.trim();
      STATE.requerimientos.push({
        id: uid(), fecha, persona, tipo, detalle,
        estado: "pendiente",
        evidencia: anexoData ? {data:anexoData, mime:anexoMime, nombre:anexoNombre} : null,
        registradoPor: session.nombre, // huella de quién lo creó realmente, para evitar suplantaciones
        fechaRegistro: todayStr(),
      });
      await saveState("requerimientos");
      await crearNotificacion({
        tipo:"requerimiento_nuevo", destinatario:"jefatura", refFecha:fecha,
        mensaje:`${persona} solicitó "${tipoRequerimiento(tipo).label}" para el ${fmtDate(fecha)}.`,
      });
      closeModal();
      abrirDiaRequerimiento(fecha);
      drawCalendario();
    });
  }
}

async function descargarEvidenciaComoPDF(reqId){
  const r = STATE.requerimientos.find(x=>x.id===reqId);
  if(!r || !r.evidencia) return;
  if(!window.PDFLib){ alert("No se pudo cargar el generador de PDF. Intenta de nuevo."); return; }
  const { PDFDocument } = window.PDFLib;
  const bytes = Uint8Array.from(atob(r.evidencia.data), c=>c.charCodeAt(0));
  let outBytes;
  if(r.evidencia.mime==="application/pdf"){
    outBytes = bytes;
  } else {
    try{
      const pdfDoc = await PDFDocument.create();
      const img = r.evidencia.mime.includes("png") ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
      const pageW = 595.32, pageH = 841.92, margen = 40;
      const escala = Math.min((pageW-margen*2)/img.width, (pageH-margen*2)/img.height, 1);
      const w = img.width*escala, h = img.height*escala;
      const page = pdfDoc.addPage([pageW, pageH]);
      page.drawImage(img, { x:(pageW-w)/2, y:(pageH-h)/2, width:w, height:h });
      outBytes = await pdfDoc.save();
    }catch(e){ alert("No se pudo convertir este anexo a PDF."); return; }
  }
  const blob = new Blob([outBytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Anexo_${r.persona.replace(/\s+/g,"_")}_${r.fecha}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function descargarEvidenciaOriginal(reqId){
  const r = STATE.requerimientos.find(x=>x.id===reqId);
  if(!r || !r.evidencia) return;
  const a = document.createElement("a");
  a.href = `data:${r.evidencia.mime};base64,${r.evidencia.data}`;
  a.download = r.evidencia.nombre || `anexo_${reqId}`;
  document.body.appendChild(a); a.click(); a.remove();
}

function drawVentasDiariasTabla(){
  const cont = document.getElementById("ventasDiariasTabla");
  const mes = parseInt(document.getElementById("vdMes").value);
  const anio = parseInt(document.getElementById("vdAnio").value);
  const esJefatura = session.rol==="jefatura";
  const diasEnMes = new Date(anio, mes, 0).getDate();
  const asesores = activeRoster();

  let totalPresupuesto=0, totalVenta=0;
  const filas = [];
  for(let d=1; d<=diasEnMes; d++){
    const fecha = `${anio}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const registro = STATE.ventasDiarias[fecha] || {};
    if(registro.presupuesto) totalPresupuesto += registro.presupuesto;
    if(registro.venta) totalVenta += registro.venta;
    const cumplimiento = (registro.presupuesto>0 && registro.venta!=null) ? registro.venta/registro.presupuesto : null;
    const clase = registro.venta!=null ? claseCumplimiento(cumplimiento) : "";
    filas.push(`
      <tr data-fecha="${fecha}">
        <td class="mono">${String(d).padStart(2,'0')}/${String(mes).padStart(2,'0')}</td>
        <td><input type="number" class="vd-input" data-fecha="${fecha}" data-campo="presupuesto" value="${registro.presupuesto!=null?registro.presupuesto:''}" ${esJefatura?'':'disabled'} style="width:110px;"></td>
        <td><input type="number" class="vd-input" data-fecha="${fecha}" data-campo="venta" value="${registro.venta!=null?registro.venta:''}" ${esJefatura?'':'disabled'} style="width:110px;"></td>
        <td>${cumplimiento!=null ? `<span class="grav-badge grav-${clase}">${Math.round(cumplimiento*100)}%</span>` : "—"}</td>
        <td><input type="number" class="vd-input" data-fecha="${fecha}" data-campo="accesorios" value="${registro.accesorios!=null?registro.accesorios:''}" ${esJefatura?'':'disabled'} style="width:70px;"></td>
        <td><input type="number" class="vd-input" data-fecha="${fecha}" data-campo="ropa" value="${registro.ropa!=null?registro.ropa:''}" ${esJefatura?'':'disabled'} style="width:70px;"></td>
        <td>${esJefatura ? `<select class="vd-input" data-fecha="${fecha}" data-campo="responsable" style="min-width:150px;" ${esJefatura?'':'disabled'}>

              ${asesores.map(a=>`<option value="${escapeHtml(a.nombre)}" ${registro.responsable===a.nombre?'selected':''}>${escapeHtml(a.nombre)}</option>`).join("")}
            </select>` : escapeHtml(registro.responsable||"—")}</td>
        <td style="font-size:10.5px;color:var(--muted);white-space:nowrap;">${registro.actualizadoPor?`${escapeHtml(registro.actualizadoPor)}<br>${fmtDate(registro.fechaActualizacion)}`:""}</td>
      </tr>
    `);
  }
  const cumplimientoMes = totalPresupuesto>0 ? totalVenta/totalPresupuesto : null;

  cont.innerHTML = `
    <div style="display:flex;gap:24px;margin-bottom:12px;flex-wrap:wrap;">
      <div class="kv" style="min-width:200px;"><span>Presupuesto acumulado del mes</span><strong>${fmtMoney(totalPresupuesto)}</strong></div>
      <div class="kv" style="min-width:200px;"><span>Venta acumulada del mes</span><strong>${fmtMoney(totalVenta)}</strong></div>
      <div class="kv" style="min-width:150px;"><span>Cumplimiento</span><strong>${cumplimientoMes!=null?Math.round(cumplimientoMes*100)+'%':'—'}</strong></div>
    </div>

      <table style="font-size:12px;">
        <thead><tr><th>Día</th><th>Presupuesto</th><th>Venta</th><th>Cumpl.</th><th>Acces.</th><th>Ropa</th><th>Responsable</th><th>Actualizado por</th></tr></thead>

        STATE.ventasDiarias[fecha] = registro;

async function generarInforme(){
  const mes = parseInt(document.getElementById("prMes").value);
  const anio = parseInt(document.getElementById("prAnio").value);
  const persona = document.getElementById("prPersona")?.value || "";
  const modo = document.getElementById("prModo")?.value || "proyectado";
  const res = document.getElementById("repResultado");
  const lista = presupuestosDelMes(mes, anio);
  if(lista.length===0){
    res.innerHTML = `<div class="card"><div class="empty">No hay un presupuesto con datos de KPIS para ${MESES[mes-1]} ${anio}. Súbelo en Configuración → Presupuestos.</div></div>`;
    return;
  }
  const horarioMes = STATE.horarios[`${anio}-${mes}`];
  const etiquetaModo = modo==="proyectado" ? `mensual proyectado (${HORAS_SEMANA_FULLTIME}h/semana full-time × ${SEMANAS_PROYECCION_MES} semanas, ${HORAS_MES_PARTTIME}h/mes fijas part-time)` : "de las semanas efectivamente cargadas";

  if(persona){
    /* -------- Informe individual: ventas vs. presupuesto, sincronizado con horas trabajadas -------- */
    res.innerHTML = `<div class="card"><span class="loader"></span> Generando informe de ${escapeHtml(persona)}...</div>`;
    const personaRoster = STATE.roster.find(x=>x.nombre===persona);
    const v = calcularVistaMensual(persona, personaRoster?.cargo||"", lista, modo);
    if(v.presupuestoMes<=0 && v.ventaMes<=0){
      res.innerHTML = `<div class="card"><div class="empty">No se encontró a "${escapeHtml(persona)}" en el archivo de presupuesto de ${MESES[mes-1]} ${anio}.</div></div>`;
      return;
    }
    const pct = v.cumplimientoMes!=null ? Math.round(v.cumplimientoMes*100) : null;
    const sistema = "Eres un asistente de gestión de tienda retail en Colombia. A partir de datos de ventas, presupuesto y horas trabajadas, generas un informe breve. Respondes ÚNICAMENTE con un JSON con las claves: informeJefe (string, hasta 130 palabras, tono profesional para jefatura, interpretando el cumplimiento y las horas) e informeAsesor (string, hasta 60 palabras, tono directo y motivador dirigido al propio asesor). No inventes cifras.";
    const prompt = `Asesor: ${persona}\nMes: ${MESES[mes-1]} ${anio}\nPresupuesto ${etiquetaModo}: ${fmtMoney(v.presupuestoMes)}\nVenta neta acumulada: ${fmtMoney(v.ventaMes)}\nCumplimiento: ${pct!=null?pct+'%':'sin datos de venta'}\nHoras ${modo==='proyectado'?'proyectadas del mes':'registradas'}: ${Math.round(v.horasMes||0)} h\n${horarioMes? '' : 'Nota: no hay un horario generado en el sistema para este mes, así que no se puede cruzar el detalle diario.'}\n\nGenera el JSON solicitado.`;
    try{
      const text = await callClaude(prompt, sistema);
      const json = extractJson(text);
      res.innerHTML = `
        ${letterheadHtml()}
        <div class="card"><h3>Informe para jefatura</h3><p style="white-space:pre-wrap;">${escapeHtml(json.informeJefe)}</p></div>
        <div class="card"><h3>Resumen para el asesor</h3><p style="white-space:pre-wrap;">${escapeHtml(json.informeAsesor)}</p></div>
      `;
    }catch(e){
      res.innerHTML = `<div class="card">No se pudo generar el informe (${escapeHtml(e.message)}). Intenta de nuevo.</div>`;
    }
    return;
  }

  /* -------- Informe general: todo el equipo, ventas + horas trabajadas -------- */
  res.innerHTML = `<div class="card"><span class="loader"></span> Generando informe general...</div>`;
  const personal = activeRoster("asesor");
  const filas = personal.map(p=>({p, v:calcularVistaMensual(p.nombre, p.cargo, lista, modo)})).filter(x=>x.v.presupuestoMes>0 || x.v.ventaMes>0);
  if(filas.length===0){
    res.innerHTML = `<div class="card"><div class="empty">No se encontraron coincidencias entre el roster y los nombres del archivo de presupuesto.</div></div>`;
    return;
  }
  filas.sort((a,b)=>(b.v.cumplimientoMes||0)-(a.v.cumplimientoMes||0));
  const presupuestoTotal = filas.reduce((s,x)=>s+x.v.presupuestoMes,0);
  const ventaTotal = filas.reduce((s,x)=>s+x.v.ventaMes,0);
  const horasTotal = filas.reduce((s,x)=>s+x.v.horasMes,0);

      ${!horarioMes ? `<div class="kv"><span style="color:var(--warn);">No hay un horario generado en el sistema para este mes</span><strong></strong></div>` : ""}
    </div>

      ${filas.map(({p,v})=>`<div class="kv"><span>${escapeHtml(p.nombre)}</span><strong>${v.cumplimientoMes!=null?Math.round(v.cumplimientoMes*100)+'%':'—'} · ${fmtMoney(v.ventaMes)}</strong></div>`).join("")}
    </div>
  `;

  const sistema = "Eres un asistente de gestión de tienda retail en Colombia. Escribes informes ejecutivos breves y objetivos sobre cumplimiento de presupuesto y ventas, sincronizados con las horas trabajadas por el equipo. Estructura la respuesta en 2-3 párrafos cortos en español: un resumen general del cumplimiento, quiénes destacan o necesitan apoyo, y una recomendación breve para jefatura. Máximo 180 palabras. No inventes cifras ni repitas la tabla completa.";
  const prompt = `Mes: ${MESES[mes-1]} ${anio}\nPresupuesto ${etiquetaModo}: ${fmtMoney(presupuestoTotal)}\nVenta neta total: ${fmtMoney(ventaTotal)}\nCumplimiento general: ${cumplimientoGeneral!=null?Math.round(cumplimientoGeneral*100)+'%':'sin datos'}\nHoras totales: ${Math.round(horasTotal)}\n\nCumplimiento por asesor:\n${filas.map(({p,v})=>`- ${p.nombre}: ${v.cumplimientoMes!=null?Math.round(v.cumplimientoMes*100)+'%':'sin ventas'} (${Math.round(v.horasMes||0)} h)`).join("\n")}\n\nEscribe el informe ejecutivo solicitado.`;

function fmtMoney(n){
  if(n==null || isNaN(n)) return "—";
  return "$" + Math.round(n).toLocaleString("es-CO");
}
function presupuestosDelMes(mes, anio){
  return STATE.presupuestos.filter(p=>p.mes===mes && p.anio===anio && p.kpis);
}
function datosPresupuestoPersona(nombre, listaPresupuestos){
  let presupuestoTotal=0, horasTotal=0, acumuladoNetoTotal=0, semanas=0;
  const detalleSemanas = [];
  listaPresupuestos.forEach(p=>{
    const real = buscarEnKpis(p.kpis.reales, nombre);
    const meta = buscarEnKpis(p.kpis.metas, nombre);
    if(real && (real.pto!=null || real.acumuladoNeto!=null)){
      presupuestoTotal += (real.pto||0);
      acumuladoNetoTotal += (real.acumuladoNeto||0);
      horasTotal += (real.horasTrabajadas!=null? real.horasTrabajadas : (meta?meta.horas:0)||0);
      semanas++;
      detalleSemanas.push({label:p.kpis.semanaLabel||`${MESES[p.mes-1]} ${p.anio}`, presupuesto:real.pto, acumulado:real.acumuladoNeto, cumplimiento:real.cumplimiento});
    } else if(meta){
      presupuestoTotal += (meta.presupuesto||0);
      horasTotal += (meta.horas||0);
      semanas++;
      detalleSemanas.push({label:p.kpis.semanaLabel||`${MESES[p.mes-1]} ${p.anio}`, presupuesto:meta.presupuesto, acumulado:null, cumplimiento:null});
    }
  });
  const cumplimiento = presupuestoTotal>0 && acumuladoNetoTotal>0 ? acumuladoNetoTotal/presupuestoTotal : null;
  return {presupuestoTotal, horasTotal, acumuladoNetoTotal, semanas, cumplimiento, detalleSemanas};
}

const HORAS_SEMANA_FULLTIME = 42;
const HORAS_MES_PARTTIME = 120;
const SEMANAS_PROYECCION_MES = 4;

/* Proyección mensual automática: full-time = 42h/semana x 4 semanas, part-time = 120h/mes fijas.
   Usa la(s) tasa(s) de venta-por-hora de la(s) semana(s) subidas; si falta alguna semana del mes,
   la proyecta con el promedio de las tasas disponibles — así con un solo archivo semanal ya se
   puede generar el estimado del mes completo. */
function proyeccionMensualPersona(cargo, listaPresupuestos){
  const tasas = listaPresupuestos.map(p=>p.kpis && p.kpis.ventaPorHora).filter(v=>v>0);
  const tasaProm = tasas.length ? tasas.reduce((a,b)=>a+b,0)/tasas.length : 0;

  if(esCargoPartTime(cargo)){
    return {
      horasProyectadas: HORAS_MES_PARTTIME,
      presupuestoProyectado: HORAS_MES_PARTTIME * tasaProm,
      tasaUsada: tasaProm,
      semanasConSoporteReal: tasas.length,
      semanasProyectadas: 0,
    };
  }

  const semanasReales = Math.min(tasas.length, SEMANAS_PROYECCION_MES);
  const totalReal = tasas.slice(0, semanasReales).reduce((s,t)=> s + HORAS_SEMANA_FULLTIME*t, 0);
  const semanasFaltantes = SEMANAS_PROYECCION_MES - semanasReales;
  const totalProyectado = totalReal + semanasFaltantes*HORAS_SEMANA_FULLTIME*tasaProm;
  const horas = HORAS_SEMANA_FULLTIME*SEMANAS_PROYECCION_MES;
  return {
    horasProyectadas: horas,
    presupuestoProyectado: totalProyectado,
    tasaUsada: horas>0 ? totalProyectado/horas : 0,
    semanasConSoporteReal: semanasReales,
    semanasProyectadas: semanasFaltantes,
  };
}
function claseCumplimiento(c){
  if(c==null) return "amarillo";
  if(c>=1) return "verde";
  if(c>=0.7) return "amarillo";
  return "rojo";
}
function colorCumplimiento(clase){
  return clase==="verde" ? "#1F8A70" : clase==="amarillo" ? "#D98A2B" : "#B4472A";
}
function donutHtml(pct, size, etiqueta){
  size = size || 84;
  const p = pct==null ? 0 : Math.max(0, Math.min(100, Math.round(pct*100)));
  const clase = claseCumplimiento(pct);
  const color = pct==null ? "#9AA0A8" : colorCumplimiento(clase);
  const hueco = Math.round(size*0.68);
  return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${color} ${p*3.6}deg, #EEF0EC 0deg);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <div style="width:${hueco}px;height:${hueco}px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:${size<70?11:13}px;font-weight:700;color:${color};">${pct==null?'—':p+'%'}</div>
      </div>
      ${etiqueta?`<div style="font-size:11px;text-align:center;color:var(--muted);max-width:${size+20}px;">${etiqueta}</div>`:""}
    </div>`;
}
function calcularReconocimientos(reales){
  const usados = new Set();
  const resultado = [];
  function elegir(categoria, metricFn, formatoFn){
    const candidatos = reales.filter(r=> metricFn(r)!=null && metricFn(r)>0).sort((a,b)=> metricFn(b)-metricFn(a));
    const ganador = candidatos.find(r=> !usados.has(normTxt(r.nombre)));
    if(ganador){
      usados.add(normTxt(ganador.nombre));
      resultado.push({categoria, nombre:ganador.nombre, valor: formatoFn? formatoFn(metricFn(ganador)) : metricFn(ganador)});
    } else {
      resultado.push({categoria, nombre:null, valor:null});
    }
  }
  elegir("Mejor vendedor en pares", r=>r.paresVenta);
  elegir("Mejor vendedor en accesorios y ropa", r=>(r.accVenta||0)+(r.ropaVenta||0));
  // KPIS: la persona más completa, promedio normalizado de todas las métricas evaluadas
  const metrics = ["paresVenta","accVenta","ropaVenta","trx","upt","cumplimiento"];
  const maxes = {}; metrics.forEach(m=> maxes[m] = Math.max(...reales.map(r=>r[m]||0), 0.0001));
  const puntajes = reales.map(r=>({r, score: metrics.reduce((s,m)=> s+(r[m]||0)/maxes[m], 0)})).sort((a,b)=>b.score-a.score);
  const kpisGanador = puntajes.find(x=> !usados.has(normTxt(x.r.nombre)));
  if(kpisGanador){ usados.add(normTxt(kpisGanador.r.nombre)); resultado.push({categoria:"KPIS — persona más completa", nombre:kpisGanador.r.nombre, valor:null}); }
  else resultado.push({categoria:"KPIS — persona más completa", nombre:null, valor:null});
  elegir("Ganando clientes (más transacciones)", r=>r.trx);
  elegir("Mejor UPT", r=>r.upt, v=>v.toFixed(2));
  elegir("Ventas (mayor % de cumplimiento)", r=>r.cumplimiento, v=>Math.round(v*100)+"%");
  return resultado;
}
function horasDelDiaTotalYEfectivas(horarioMes, anio, mes, dia){
  let total=0, efectivas=0;
  const fecha = `${anio}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
  const ausentesEseDia = new Set(STATE.retardos.filter(r=>r.fecha===fecha && (r.tipoId==="ausencia_total"||r.tipoId==="ausencia_parcial")).map(r=>r.asesor));
  activeRoster().forEach(p=>{
    const info = horarioMes.grid[p.id];
    if(!info) return;
    const c = info.dias[dia];
    if(c && c.tipo==="trabajo" && c.horas>0){
      total += c.horas;
      if(!ausentesEseDia.has(p.nombre)) efectivas += c.horas;
    }
  });
  return {total, efectivas};
}

/* ======================= MOTOR DE DISTRIBUCIÓN DE PRESUPUESTO DIARIO POR ROL ======================= */
function rolPresupuesto(cargo){
  const c = (cargo||"").toUpperCase();
  if(c.includes("SUBJEFE")) return "subjefe";
  if(c.includes("JEFE")) return "jefe";
  if(c.includes("CAJER")) return "cajero";
  return "general"; // full-time, part-time y temporales
}
function targetDelDia(fecha){
  for(const p of STATE.presupuestos){
    if(!p.target || !p.target.dias) continue;
    const d = p.target.dias.find(x=>x.fecha===fecha);
    if(d) return d;
  }
  return null;
}
function horaProgramadaPersonaDia(personaId, fecha){
  const [anio, mes, diaStr] = fecha.split("-");
  const dia = parseInt(diaStr);
  const override = STATE.kpisDiario[fecha] && STATE.kpisDiario[fecha][personaId];
  if(override && override.horas!=null) return override.horas;
  const horarioMes = STATE.horarios[`${parseInt(anio)}-${parseInt(mes)}`];
  const info = horarioMes && horarioMes.grid[personaId];
  const c = info && info.dias[dia];
  return (c && c.tipo==="trabajo") ? c.horas : 0;
}
function calcularDistribucionDia(fecha){
  const t = targetDelDia(fecha);
  const totalDia = t ? t.target : null;
  const cfg = STATE.distribucionConfig;
  const personas = activeRoster().map(p=>({ p, horas: horaProgramadaPersonaDia(p.id, fecha), rol: rolPresupuesto(p.cargo) }))
    .filter(x=>x.horas>0);

  let poolFijo = 0;
  const resultado = personas.map(x=>{
    let meta = null, pctFijo = null;
    if(totalDia!=null){
      if(x.rol==="jefe"){ pctFijo = cfg.pctJefe; meta = totalDia*pctFijo/100; }
      else if(x.rol==="subjefe"){ pctFijo = cfg.pctSubjefe; meta = totalDia*pctFijo/100; }
      else if(x.rol==="cajero"){ pctFijo = cfg.pctCajero; meta = totalDia*pctFijo/100; }
      if(meta!=null) poolFijo += meta;
    }
    return { persona:x.p, horas:x.horas, rol:x.rol, pctFijo, meta };
  });

  const horasGeneral = resultado.filter(r=>r.rol==="general").reduce((s,r)=>s+r.horas,0);
  const poolGeneral = totalDia!=null ? Math.max(0, totalDia - poolFijo) : null;
  resultado.forEach(r=>{
    if(r.rol==="general" && totalDia!=null){
      r.meta = horasGeneral>0 ? poolGeneral*(r.horas/horasGeneral) : 0;
    }
  });

  return { fecha, totalDia, real: t?t.real:null, poolGeneral, horasGeneral, filas: resultado };
}
function ventaRealPersonaDia(personaId, fecha){
  const o = STATE.kpisDiario[fecha] && STATE.kpisDiario[fecha][personaId];
  return o && o.ventaReal!=null ? o.ventaReal : null;
}

function calcularVistaMensual(persona, cargo, lista, modo){
  const d = datosPresupuestoPersona(persona, lista);
  if(modo==="cargado"){
    return { presupuestoMes:d.presupuestoTotal, horasMes:d.horasTotal, ventaMes:d.acumuladoNetoTotal, cumplimientoMes:d.cumplimiento, proyeccion:null, detalleSemanas:d.detalleSemanas };
  }
  const proy = proyeccionMensualPersona(cargo, lista);
  const cumplimientoMes = proy.presupuestoProyectado>0 ? d.acumuladoNetoTotal/proy.presupuestoProyectado : null;
  return { presupuestoMes:proy.presupuestoProyectado, horasMes:proy.horasProyectadas, ventaMes:d.acumuladoNetoTotal, cumplimientoMes, proyeccion:proy, detalleSemanas:d.detalleSemanas };
}

      : `Mostrando solo la suma de las semanas efectivamente cargadas para este mes.`;

  const horarioMes = STATE.horarios[key];
  let diasEstimados = [];
  if(horarioMes){
    const p = personaRoster;
    const infoPersona = p ? horarioMes.grid[p.id] : null;
    const ventaPorHoraRef = lista[lista.length-1].kpis.ventaPorHora || (lista[lista.length-1].kpis.presupuestoSemanaTotal/lista[lista.length-1].kpis.horasLaboradasTotal);
    if(infoPersona){
      const ausenciasPersona = new Set(STATE.retardos.filter(r=>r.asesor===persona && (r.tipoId==="ausencia_total"||r.tipoId==="ausencia_parcial")).map(r=>r.fecha));
      Object.entries(infoPersona.dias).forEach(([dia,info])=>{
        if(info.tipo==="trabajo" && info.horas>0){
          const fecha = `${anio}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
          const ausente = ausenciasPersona.has(fecha);
          let estimado = 0;
          if(!ausente){
            const {total, efectivas} = horasDelDiaTotalYEfectivas(horarioMes, anio, mes, parseInt(dia));
            const factorRedistribucion = efectivas>0 ? total/efectivas : 1;
            estimado = info.horas * ventaPorHoraRef * factorRedistribucion;
          }
          diasEstimados.push({dia:parseInt(dia), horas:info.horas, ausente, estimado});
        }
      });
      diasEstimados.sort((a,b)=>a.dia-b.dia);
    }
  }

  res.innerHTML = resumenMesHtml + `
    <div class="card">
      <p style="color:var(--muted);font-size:11.5px;margin:0 0 10px;">${notaProy}</p>
      <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">
        ${donutHtml(semanalReal?semanalReal.cumplimiento:null, 100, `Semanal (${masReciente.kpis?.semanaLabel||'última semana'})`)}
        ${donutHtml(v.cumplimientoMes, 100, `Mensual (${MESES[mes-1]})${modo==='proyectado'?' proyectado':''}`)}
      </div>
      <div style="margin-top:16px;">
        <div class="kv"><span>Presupuesto ${modo==='proyectado'?'mensual proyectado':'cargado'}</span><strong>${fmtMoney(v.presupuestoMes)}</strong></div>
        <div class="kv"><span>Venta neta acumulada</span><strong>${fmtMoney(v.ventaMes)}</strong></div>
        <div class="kv"><span>Horas ${modo==='proyectado'?'proyectadas del mes':'registradas'}</span><strong>${Math.round(v.horasMes||0)} h</strong></div>
        ${semanalReal?.paresVenta!=null?`<div class="kv"><span>Pares vendidos (última semana)</span><strong>${semanalReal.paresVenta}</strong></div>`:""}
        ${semanalReal?.trx!=null?`<div class="kv"><span>Transacciones (última semana)</span><strong>${semanalReal.trx}</strong></div>`:""}
        ${semanalReal?.upt!=null?`<div class="kv"><span>UPT (última semana)</span><strong>${semanalReal.upt.toFixed(2)}</strong></div>`:""}
      </div>
    </div>

    <div class="card">
      <h4 style="font-size:13px;margin:0 0 8px;">Por semana (cargada)</h4>
      ${v.detalleSemanas.length ? v.detalleSemanas.map(s=>{
        const pct = s.cumplimiento!=null? Math.round(s.cumplimiento*100) : null;
        return `<div class="kv"><span>${escapeHtml(s.label)} — presupuesto ${fmtMoney(s.presupuesto)}${s.acumulado!=null?` · vendido ${fmtMoney(s.acumulado)}`:''}</span><strong>${pct!=null?pct+'%':'—'}</strong></div>`;
      }).join("") : `<div class="empty">Sin semanas cargadas para esta persona en este mes.</div>`}
    </div>

    <div class="card">
      ${diasEstimados.length ? `
        <h4 style="font-size:13px;margin:0 0 8px;">Presupuesto diario estimado (según Horarios, ${MESES[mes-1]})</h4>
        <p style="color:var(--muted);font-size:11.5px;margin-bottom:8px;">Estimado a partir de las horas programadas × venta por hora del presupuesto (${fmtMoney(lista[lista.length-1].kpis.ventaPorHora||0)}/h). Si el día está marcado como ausencia, el presupuesto de ese día se reparte entre quienes sí trabajaron.</p>
        <div style="max-height:220px;overflow-y:auto;">
          ${diasEstimados.map(x=>`<div class="kv"><span>${String(x.dia).padStart(2,'0')}/${String(mes).padStart(2,'0')} · ${x.horas}h${x.ausente?' · <span style="color:var(--warn);">ausente, redistribuido</span>':''}</span><strong>${fmtMoney(x.estimado)}</strong></div>`).join("")}
        </div>
      ` : `<div class="empty">No hay un horario generado para ${MESES[mes-1]} ${anio} en Configuración → Horarios, así que no se puede estimar el detalle diario.</div>`}
    </div>
  `;
}

function renderPresupuestos(main){

      <h3>Excel web conectado</h3>
      <p style="color:var(--muted);font-size:12.5px;">Conecta un Excel/Google Sheet que se mantenga en vivo. Publica cada pestaña como CSV (en Sheets: Archivo → Compartir → Publicar en la web → eliges la pestaña → formato CSV) y pega aquí los enlaces. Cuando el equipo actualice el archivo, solo tienes que darle a "Actualizar" — no hace falta volver a subir nada.</p>
      <div class="form-grid">
        <div class="full"><label>Enlace CSV — hoja KPIS SEM.</label><input type="text" id="webUrlKpis" placeholder="https://docs.google.com/.../pub?output=csv" value="${escapeHtml(STATE.presupuestoWebConfig.urlKpis||"")}"></div>
        <div class="full"><label>Enlace CSV — hoja Target (opcional)</label><input type="text" id="webUrlTarget" placeholder="https://..." value="${escapeHtml(STATE.presupuestoWebConfig.urlTarget||"")}"></div>
        <div class="full"><label>Enlace CSV — hoja RepVenta (opcional)</label><input type="text" id="webUrlRepVenta" placeholder="https://..." value="${escapeHtml(STATE.presupuestoWebConfig.urlRepVenta||"")}"></div>
      </div>
      <button class="btn-sm" id="webGuardarEnlaces" style="margin-top:10px;">Guardar enlaces</button>
      <div style="border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
        <div><label style="font-size:11.5px;color:var(--muted);text-transform:uppercase;">Mes a actualizar</label><br><select id="webMes">${MESES.map((m,i)=>`<option value="${i+1}" ${i===new Date().getMonth()?'selected':''}>${m}</option>`).join("")}</select></div>

      urlRepVenta: document.getElementById("webUrlRepVenta").value.trim(),
    };
    await saveState("presupuestoWebConfig");
    document.getElementById("webEstado").innerHTML = `<span style="color:#1F8A70;">✓ Enlaces guardados.</span>`;
  });
  document.getElementById("webActualizar").addEventListener("click", actualizarDesdeExcelWeb);
  let archivoData = null, archivoMime = null, archivoNombre = null, archivoResumen = "";
  let kpisData = null, kpisDiaData = null, kpisMenData = null, targetData = null, repVentaData = null;

  async function procesarArchivoSeleccionado(f){
    archivoData = await fileToBase64(f);
    archivoMime = f.type || "application/octet-stream";
    archivoNombre = f.name;
    archivoResumen = "";
    kpisData = null; kpisDiaData = null; kpisMenData = null; targetData = null; repVentaData = null;
    try{
      if(window.XLSX){
        const wb = XLSX.read(archivoData, {type:"base64"});
        archivoResumen = `${wb.SheetNames.length} hoja(s): ${wb.SheetNames.join(", ")}`;
        kpisData = parseKpisSem(wb);
        kpisDiaData = parseKpisDia(wb);
        kpisMenData = parseKpisMen(wb);
        targetData = parseTarget(wb);
        repVentaData = parseRepVenta(wb);
        const detectados = [];
        if(kpisData) detectados.push(`KPIS semanal de ${kpisData.metas.length||kpisData.reales.length} personas`);
        if(kpisDiaData) detectados.push(`KPIS diario${kpisDiaData.fechaExacta?` (${kpisDiaData.fechaExacta})`:''}`);
        if(kpisMenData) detectados.push("KPIS mensual");
        if(targetData) detectados.push("Target mensual");
        if(repVentaData) detectados.push("RepVenta/REP_DIARIO del día");
        if(detectados.length) archivoResumen += ` · Detectado: ${detectados.join(", ")}`;
      }
    }catch(err){ /* si no se puede leer, seguimos sin preview */ }
  }

    const mes = parseInt(document.getElementById("pMes").value);
    const anio = parseInt(document.getElementById("pAnio").value) || anioActual;
    const tipo = document.getElementById("pTipo").value;
    if(tipo==="archivo" && !archivoData){ alert("Adjunta el archivo del presupuesto."); return; }
    const url = document.getElementById("pUrl").value.trim();
    if(tipo==="web" && !url){ alert("Escribe la URL del Excel/Sheet."); return; }
    const hoy = todayStr();
    // si ya se subió un archivo hoy para este mismo mes/año, se actualiza en el mismo registro
    // en vez de crear uno nuevo — así subir todos los días no llena la lista de archivos
    let registro = STATE.presupuestos.find(p=>p.mes===mes && p.anio===anio && p.tipo===tipo && p.fecha===hoy);
    if(!registro){
      registro = { id: uid(), mes, anio, tipo };
      STATE.presupuestos.unshift(registro);
    }
    Object.assign(registro, {
      nombreArchivo: archivoNombre, dataBase64: archivoData, mime: archivoMime, resumen: archivoResumen,
      urlWeb: url || null,
      kpis: kpisData, kpisDia: kpisDiaData, kpisMen: kpisMenData, target: targetData, repVenta: repVentaData,
      fecha: hoy, subidoPor: session.nombre,
    });
    await saveState("presupuestos");
  }

  document.getElementById("pTipo").addEventListener("change", (e)=>{
    document.getElementById("pArchivoWrap").style.display = e.target.value==="archivo" ? "block" : "none";
    document.getElementById("pWebWrap").style.display = e.target.value==="web" ? "block" : "none";
  });
  document.getElementById("pDrop").addEventListener("click", ()=> document.getElementById("pFile").click());
  document.getElementById("pFile").addEventListener("change", async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    await procesarArchivoSeleccionado(f);
    document.getElementById("pFileName").textContent = `Adjunto: ${f.name} · ${archivoResumen}`;
  });

  document.getElementById("pGuardar").addEventListener("click", async ()=>{
    await guardarPresupuestoActual();
    renderPresupuestos(main);
  });
  drawPresupuestos();
  drawPresupSubNav();
  renderPresupSub();
}

function drawPresupTarget(){
  const mes = parseInt(document.getElementById("tgMes").value);

  const t = p.target;

  const diasDelMesArr = (t.dias||[]).filter(d=>d.fecha.startsWith(`${anio}-${String(mes).padStart(2,'0')}`));
  res.innerHTML = `

/* ---------- Lector de "Ventas rápidas por empleado" (PDF o imagen) → alimenta KPIS Diario ---------- */
async function handleLeerVentasPorEmpleado(e){
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  e.target.value = "";
  const fechaSeleccionada = document.getElementById("kdFecha").value;

  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Leyendo reporte de ventas...</h3>
    <div id="lecturaVentasLoading"><span class="loader"></span> Analizando ${files.length} archivo(s), esto puede tardar unos segundos...</div>
  `, true);

  const sistema = "Eres un asistente que extrae datos de reportes de ventas por empleado de una tienda retail en Colombia (formato tipo 'Ventas rápidas por empleado'). Analiza el documento (puede tener varias páginas, con hasta 30-40 empleados) y responde ÚNICAMENTE con un JSON compacto: {\"fecha\":\"YYYY-MM-DD\",\"registros\":[[id,nombre,ventaNeta], ...]}. Cada elemento de 'registros' es un arreglo de 3 valores (NO un objeto, para ahorrar espacio): [0]=id (el número de identificación/código del empleado tal como aparece en la columna 'ID', como texto; cadena vacía \"\" si no hay columna de ID), [1]=nombre tal cual aparece en el reporte (usualmente 'APELLIDOS, NOMBRE'), [2]=ventaNeta como número sin símbolo de moneda ni separadores de miles, con punto decimal. 'fecha' se toma del campo 'Fecha:' del reporte (null si no aparece). Incluye a TODOS los empleados listados en TODAS las páginas del documento, sin excepción — no te quedes corto, es más importante incluir a todos que dar detalle extra. No incluyas la fila de 'Total'. No agregues texto ni explicación fuera del JSON.";

  let todos = [];
  let fechaDetectada = null;
  let errores = [];
  let huboTruncamiento = false;
  for(const f of files){
    try{
      let contenido;
      if(f.type==="application/pdf"){
        const base64 = await fileToBase64(f);
        contenido = { type:"document", source:{ type:"base64", media_type:"application/pdf", data:base64 } };
      } else if(/^image\/(jpeg|jpg|png|gif|webp)$/i.test(f.type)){
        const { base64, mime } = await resizeImageParaIA(f);
        contenido = { type:"image", source:{ type:"base64", media_type:mime, data:base64 } };
      } else {
        throw new Error(`Formato "${f.type||'desconocido'}" no soportado. Usa PDF, JPG, PNG, GIF o WEBP.`);
      }
      const userContent = [ contenido, { type:"text", text:"Extrae los datos de ventas por empleado de este reporte, en el formato compacto de arreglos indicado." } ];
      const text = await callClaudeConReintento(userContent, sistema);
      const json = extractJson(text);
      if(json.__truncado) huboTruncamiento = true;
      if(json.fecha && !fechaDetectada) fechaDetectada = json.fecha;
      if(Array.isArray(json.registros)){
        json.registros.forEach(reg=>{
          if(Array.isArray(reg)) todos.push({ id: reg[0]||"", nombre: reg[1]||"", ventaNeta: reg[2] });
          else if(reg && typeof reg==="object") todos.push(reg); // por si la IA igual responde en formato objeto
        });
      }
    }catch(err){
      const msg = /failed to fetch/i.test(err.message)
        ? "no se pudo conectar con la IA (falla de red). Revisa tu conexión e intenta de nuevo."
        : err.message;
      errores.push(`${f.name}: ${msg}`);
    }
  }

  if(todos.length===0){
    openModal(`
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>Leer ventas por empleado</h3>
      <div class="empty">No se encontraron registros de venta en el/los archivo(s).</div>
      ${errores.length ? `<div class="login-error" style="display:block;margin-top:10px;">${errores.map(escapeHtml).join("<br>")}</div>` : ""}
    `, true);
    return;
  }

  mostrarRevisionVentas(todos, fechaDetectada || fechaSeleccionada, errores, huboTruncamiento);
}

function mostrarRevisionVentas(registros, fechaSugerida, errores, huboTruncamiento){
  const personal = activeRoster();
  const filasHtml = registros.map((r,i)=>{
    const matchPorId = matchPersonaPorCodigo(r.id);
    const match = matchPorId || matchPersonaPorNombre(r.nombre);
    const opciones = personal.map(p=>`<option value="${p.id}" ${match && match.id===p.id?'selected':''}>${escapeHtml(p.nombre)}</option>`).join("");
    const insignia = matchPorId
      ? `<span class="estado-tag activo" style="margin-left:4px;">por ID</span>`
      : (match ? `<span class="estado-tag progreso" style="margin-left:4px;">por nombre</span>` : "");
    const detectadoTexto = `${r.id?String(r.id)+" · ":""}${r.nombre||""}`;
    return `
      <tr data-row="${i}" data-id="${escapeHtml(String(r.id||""))}">
        <td><input type="checkbox" class="revVChk" data-i="${i}" checked></td>
        <td style="max-width:170px;">
          <input type="text" class="revVDetectado" data-i="${i}" value="${escapeHtml(detectadoTexto)}" style="width:100%;font-size:11px;padding:4px 6px;">
          <div class="revVInsignia" data-i="${i}" style="margin-top:2px;">${!match?'<span style="color:var(--warn);font-size:10.5px;">(sin coincidencia)</span>':insignia}</div>
        </td>
        <td><select class="revVPersona" data-i="${i}"><option value="">— selecciona —</option>${opciones}</select></td>
        <td><input type="number" class="revVMonto" data-i="${i}" value="${parseFloat(r.ventaNeta)||0}" style="width:120px;"></td>
      </tr>`;
  }).join("");

  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Revisar ventas detectadas</h3>
    <div class="form-grid" style="margin-bottom:10px;">
      <div><label>Fecha del reporte</label><input type="date" id="revVFecha" value="${escapeHtml(fechaSugerida||todayStr())}"></div>
    </div>
    <p style="color:var(--muted);font-size:12.5px;">Revisa que cada persona esté bien asignada antes de aplicar. Esto sobrescribirá la venta real de KPIS Diario para esa fecha. La casilla "Detectado" es editable: si alguien nuevo está usando el ID de otra persona, corrige el texto ahí y se vuelve a buscar la coincidencia por nombre.${errores.length?` ${errores.length} archivo(s) no se pudieron leer (detalle abajo).`:""}</p>
    ${huboTruncamiento ? `<div class="login-error" style="display:block;">⚠️ La respuesta de la IA venía muy larga y se cortó — se recuperaron los registros completos que sí alcanzaron a llegar (${registros.length}), pero puede faltar gente del reporte. Revisa contra el documento original; si falta alguien, agrégalo manualmente o vuelve a leer el reporte dividiéndolo en menos personas por imagen (por ejemplo, una foto por página).</div>` : ""}
    ${errores.length ? `<div class="login-error" style="display:block;">${errores.map(escapeHtml).join("<br>")}</div>` : ""}
    <div style="overflow-x:auto;max-height:340px;">
      <table style="font-size:12px;">
        <thead><tr><th></th><th>Detectado (editable)</th><th>Persona</th><th>Venta neta</th></tr></thead>
        <tbody id="revVBody">${filasHtml}</tbody>
      </table>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-top:12px;">
      <input type="checkbox" id="revVRecordarId" checked>
      Recordar los IDs que corrija aquí, para que la próxima vez ya se asignen solos a la persona correcta
    </label>
    <button class="btn-primary" style="margin-top:10px;" id="revVAplicar">Aplicar a KPIS Diario</button>
  `, true);

  // al editar el texto "Detectado", se vuelve a buscar la persona por nombre y se actualiza el selector
  document.querySelectorAll(".revVDetectado").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const i = inp.dataset.i;
      const nuevoMatch = matchPersonaPorNombre(inp.value);
      const select = document.querySelector(`.revVPersona[data-i="${i}"]`);
      const insigniaDiv = document.querySelector(`.revVInsignia[data-i="${i}"]`);
      if(nuevoMatch){
        select.value = nuevoMatch.id;
        insigniaDiv.innerHTML = `<span class="estado-tag progreso">corregido a mano</span>`;
      } else {
        insigniaDiv.innerHTML = `<span style="color:var(--warn);font-size:10.5px;">(sin coincidencia, elige manualmente)</span>`;
      }
    });
  });

  document.getElementById("revVAplicar").addEventListener("click", async ()=>{
    const fecha = document.getElementById("revVFecha").value;
    if(!fecha){ alert("Selecciona la fecha del reporte."); return; }
    const recordarIds = document.getElementById("revVRecordarId").checked;
    const filas = document.querySelectorAll("#revVBody tr");
    if(!STATE.kpisDiario[fecha]) STATE.kpisDiario[fecha] = {};
    let aplicados = 0, saltados = 0, idsReasignados = 0;
    filas.forEach(fila=>{
      const chk = fila.querySelector(".revVChk");
      if(!chk.checked) return;
      const personaId = fila.querySelector(".revVPersona").value;
      const monto = parseFloat(fila.querySelector(".revVMonto").value);
      if(!personaId || isNaN(monto)){ saltados++; return; }
      if(!STATE.kpisDiario[fecha][personaId]) STATE.kpisDiario[fecha][personaId] = {};
      STATE.kpisDiario[fecha][personaId].ventaReal = monto;
      aplicados++;
      // si esta fila tenía un ID detectado y la persona elegida no es la dueña "natural" de ese ID,
      // se recuerda la reasignación para que futuras lecturas ya la asignen bien de una
      const idDetectado = fila.dataset.id;
      if(recordarIds && idDetectado){
        const duenoOriginal = STATE.roster.find(p=>p.codigo && String(p.codigo).trim()===idDetectado);
        if(!duenoOriginal || duenoOriginal.id!==personaId){
          guardarReasignacionId(idDetectado, personaId);
          idsReasignados++;
        }
      }
    });
    await saveState("kpisDiario");
    if(idsReasignados>0) await saveState("idReasignaciones");
    closeModal();
    const fechaInput = document.getElementById("kdFecha");
    if(fechaInput){ fechaInput.value = fecha; drawPresupKpisDiario(); }
    let msg = `Se aplicaron ${aplicados} registros.`;
    if(saltados>0) msg += ` ${saltados} se omitieron por falta de persona asignada.`;
    if(idsReasignados>0) msg += ` ${idsReasignados} ID(s) quedaron recordados para la próxima vez.`;
    if(saltados>0 || idsReasignados>0) alert(msg);
  });
}

/* ---------- 6. KPIS MENSUAL (agregado del mes) ---------- */
function acumularKpisEnRango(fechas){
  const acumulados = {}; // personaId -> {nombre, cargo, meta, venta, tieneVenta}
  fechas.forEach(fecha=>{
    const dist = calcularDistribucionDia(fecha);
    if(dist.totalDia==null) return;
    dist.filas.forEach(f=>{
      if(!acumulados[f.persona.id]) acumulados[f.persona.id] = {nombre:f.persona.nombre, cargo:f.persona.cargo, meta:0, venta:0, tieneVenta:false};
      acumulados[f.persona.id].meta += (f.meta||0);
      const vr = ventaRealPersonaDia(f.persona.id, fecha);
      if(vr!=null){ acumulados[f.persona.id].venta += vr; acumulados[f.persona.id].tieneVenta = true; }
    });
  });
  return Object.values(acumulados).sort((a,b)=> b.meta - a.meta);
}
function tablaKpisCalculadoHtml(lista){
  return `
    <table style="font-size:12px;"><thead><tr><th>Persona</th><th>Cargo</th><th>Meta</th><th>Venta real</th><th>Cumpl.</th></tr></thead><tbody>
      ${lista.map(x=>{
        const cumpl = x.tieneVenta && x.meta>0 ? x.venta/x.meta : null;
        const clase = cumpl!=null?claseCumplimiento(cumpl):"";
        return `<tr><td>${escapeHtml(x.nombre)}</td><td>${escapeHtml(x.cargo)}</td><td class="mono">${fmtMoney(x.meta)}</td><td class="mono">${x.tieneVenta?fmtMoney(x.venta):'—'}</td><td>${cumpl!=null?`<span class="grav-badge grav-${clase}">${Math.round(cumpl*100)}%</span>`:'—'}</td></tr>`;
      }).join("")}
    </tbody></table>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;margin-top:18px;">
      ${lista.map(x=> donutHtml(x.tieneVenta && x.meta>0 ? x.venta/x.meta : null, 76, escapeHtml(x.nombre.split(' ')[0]))).join("")}
    </div>
  `;
}

  `;
  ["kmMes","kmAnio"].forEach(id=>document.getElementById(id).addEventListener("input", drawPresupKpisMensual));
  drawPresupKpisMensual();
}
function drawPresupKpisMensual(){
  const mes = parseInt(document.getElementById("kmMes").value);
  const anio = parseInt(document.getElementById("kmAnio").value);
  const res = document.getElementById("kmResultado");
  const diasEnMes = new Date(anio, mes, 0).getDate();
  const fechas = [];
  for(let d=1; d<=diasEnMes; d++) fechas.push(`${anio}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  const lista = acumularKpisEnRango(fechas);
  if(lista.length===0){ res.innerHTML = `<div class="empty">No hay Target cargado para ningún día de ${MESES[mes-1]} ${anio}.</div>`; return; }
  res.innerHTML = tablaKpisCalculadoHtml(lista);
}

async function fetchCsvComoFilas(url){
  const resp = await fetch(url);
  if(!resp.ok) throw new Error("No se pudo leer el enlace (" + resp.status + ")");
  const texto = await resp.text();
  const wbCsv = XLSX.read(texto, {type:"string"});
  const hoja = wbCsv.Sheets[wbCsv.SheetNames[0]];
  return XLSX.utils.sheet_to_json(hoja, {header:1, defval:null, raw:true});
}

async function actualizarDesdeExcelWeb(){
  const cfg = STATE.presupuestoWebConfig;
  if(!cfg.urlKpis && !cfg.urlTarget && !cfg.urlRepVenta){
    alert("Pega al menos un enlace CSV y guárdalo antes de actualizar.");
    return;
  }
  const mes = parseInt(document.getElementById("webMes").value);
  const anio = parseInt(document.getElementById("webAnio").value);
  const estado = document.getElementById("webEstado");
  estado.innerHTML = `<span class="loader"></span> Leyendo el Excel web...`;

  let kpisData=null, targetData=null, repVentaData=null;
  const errores = [];

  if(cfg.urlKpis){
    try{ kpisData = parseKpisSemRows(await fetchCsvComoFilas(cfg.urlKpis)); if(!kpisData) errores.push("KPIS: no se reconoció el formato esperado."); }
    catch(e){ errores.push("KPIS: " + e.message); }
  }
  if(cfg.urlTarget){
    try{ targetData = parseTargetRows(await fetchCsvComoFilas(cfg.urlTarget)); if(!targetData) errores.push("Target: no se reconoció el formato esperado."); }
    catch(e){ errores.push("Target: " + e.message); }
  }
  if(cfg.urlRepVenta){
    try{ repVentaData = parseRepVentaRows(await fetchCsvComoFilas(cfg.urlRepVenta)); if(!repVentaData) errores.push("RepVenta: no se reconoció el formato esperado."); }
    catch(e){ errores.push("RepVenta: " + e.message); }
  }

  if(!kpisData && !targetData && !repVentaData){
    estado.innerHTML = `<span style="color:var(--warn);">No se pudo traer ningún dato. ${errores.map(escapeHtml).join(" · ")}<br>Verifica que el enlace sea el de "Publicar en la web" en formato CSV (no el de compartir normal), y que cualquiera con el link pueda verlo.</span>`;
    return;
  }

  // busca si ya existe un registro traído automáticamente para ese mes/año y lo actualiza en vez de duplicar
  let registro = STATE.presupuestos.find(p=>p.mes===mes && p.anio===anio && p.tipo==="web-auto");
  if(!registro){
    registro = { id: uid(), mes, anio, tipo:"web-auto", nombreArchivo:null, dataBase64:null, mime:null, urlWeb:cfg.urlKpis||cfg.urlTarget||cfg.urlRepVenta };
    STATE.presupuestos.unshift(registro);
  }
  if(kpisData) registro.kpis = kpisData;
  if(targetData) registro.target = targetData;
  if(repVentaData) registro.repVenta = repVentaData;
  registro.resumen = `Actualizado desde Excel web${kpisData?` · KPIS de ${kpisData.metas.length||kpisData.reales.length} personas`:""}${targetData?" · Target mensual":""}${repVentaData?" · RepVenta del día":""}`;
  registro.fecha = todayStr();
  registro.subidoPor = session.nombre;
  await saveState("presupuestos");

  estado.innerHTML = `<span style="color:#1F8A70;">✓ Actualizado — ${escapeHtml(registro.resumen)}.</span>${errores.length?`<br><span style="color:var(--warn);">${errores.map(escapeHtml).join(" · ")}</span>`:""}`;
  drawPresupuestos();
}

/* ======================= HORARIOS ======================= */
function esCargoPartTime(cargo){
  const c = (cargo||"").toUpperCase();
  return c.includes("PART-TIME") || c.includes("PART TIME");
}
function diasDelMes(anio, mes){
  const n = new Date(anio, mes, 0).getDate();
  const arr = [];
  for(let d=1; d<=n; d++){ arr.push({dia:d, weekday:new Date(anio, mes-1, d).getDay()}); }
  return arr;
}
/* Reparte proporcionalmente el patrón 3 días de 8h + 2 días de 9h (5 días = 42h) para semanas
   completas; para semanas parciales (inicio/fin de mes) escala la proporción 3:2. */
function patronHorasFT(numTrabajo){
  if(numTrabajo<=0) return [];
  const num9h = Math.round(numTrabajo * 2/5);
  const num8h = numTrabajo - num9h;
  return [...Array(num8h).fill(8), ...Array(num9h).fill(9)];
}
function agruparPorSemana(dias){
  const semanas = [];
  let actual = [];
  dias.forEach(({dia,weekday})=>{
    actual.push(dia);
    if(weekday===0){ semanas.push(actual); actual = []; }
  });
  if(actual.length) semanas.push(actual);
  return semanas;
}
function esCargoJefeOSubjefe(cargo){
  return (cargo||"").toUpperCase().includes("JEFE"); // coincide con JEFE y SUBJEFE
}
/* Elige los 2 domingos de descanso del mes para una persona FT. Jefes/subjefes: uno de esos domingos
   va pegado a su sábado anterior (fin de semana completo libre); el otro domingo queda solo.
   Cajeros y demás full-time: los 2 domingos de descanso NUNCA van pegados a un sábado libre. */
function elegirDomingosDescanso(domingos, idxFT, esJefeOSubjefe){
  const misDomingos = [];
  if(domingos.length>0) misDomingos.push(domingos[idxFT % domingos.length]);
  if(domingos.length>1) misDomingos.push(domingos[(idxFT+2) % domingos.length]);
  const domUnicos = [...new Set(misDomingos)];
  let sabadoPegado = null;
  if(esJefeOSubjefe && domUnicos.length>0){
    const candidato = domUnicos[0]-1;
    if(candidato>=1) sabadoPegado = candidato;
  }
  return { domUnicos, sabadoPegado };
}
function generarHorarioAutomatico(anio, mes, params){
  const dias = diasDelMes(anio, mes);
  const semanas = agruparPorSemana(dias);
  const domingosDelMes = dias.filter(d=>d.weekday===0).map(d=>d.dia);
  const personal = activeRoster();
  const grid = {};
  let idxFT = 0, idxPT = 0;

  // días libres solicitados por cada persona en el calendario de Requerimientos, para este mes
  const prefijoMes = `${anio}-${String(mes).padStart(2,'0')}-`;
  const librePorPersona = {};
  STATE.requerimientos.filter(r=>r.tipo==="dia_libre" && r.fecha.startsWith(prefijoMes)).forEach(r=>{
    const dia = parseInt(r.fecha.split("-")[2]);
    if(!librePorPersona[r.persona]) librePorPersona[r.persona] = new Set();
    librePorPersona[r.persona].add(dia);
  });

  personal.forEach(p=>{
    const dayMap = {};
    const diasLibreForzados = librePorPersona[p.nombre] || new Set();

    if(!esCargoPartTime(p.cargo)){
      // ===== FULL-TIME / JEFE / SUBJEFE / CAJEROS: 42h/semana, 5 días de trabajo (3 de 8h + 2 de 9h), 2 días de descanso =====
      const esJefeOSubjefe = esCargoJefeOSubjefe(p.cargo);
      const { domUnicos, sabadoPegado } = elegirDomingosDescanso(domingosDelMes, idxFT, esJefeOSubjefe);

      semanas.forEach((semDias, si)=>{
        const forzadosLibre = semDias.filter(d=>diasLibreForzados.has(d));
        const forzadosDomingo = semDias.filter(d=>domUnicos.includes(d));
        const forzadosSabado = semDias.filter(d=>d===sabadoPegado);
        const yaForzados = [...new Set([...forzadosLibre, ...forzadosDomingo, ...forzadosSabado])];
        // si el domingo de descanso de esta semana NO va pegado a sábado, hay que evitar que el
        // relleno por rotación elija el sábado y termine formando una pareja sáb-dom no intencional
        const domingoSuelto = forzadosDomingo.length>0 && forzadosSabado.length===0;

        // el relleno "libre" de descansos solo elige entre lunes-viernes: sábado y domingo quedan
        // controlados únicamente por la regla mensual de arriba (2 domingos, con o sin sábado pegado según el rol)
        const restantes = semDias.filter(d=> !yaForzados.includes(d) && ![0,6].includes(new Date(anio,mes-1,d).getDay()));
        const descansosNecesarios = Math.max(0, Math.min(2, Math.round(semDias.length*2/7)) - yaForzados.length);

        let elegidosDescanso = [];
        if(descansosNecesarios>0 && restantes.length>0){
          const offset = (idxFT + si) % restantes.length;
          const ordenRotado = [...restantes.slice(offset), ...restantes.slice(0,offset)];
          for(const d of ordenRotado){
            if(elegidosDescanso.length>=descansosNecesarios) break;
            const esSabado = new Date(anio,mes-1,d).getDay()===6;
            if(domingoSuelto && esSabado) continue; // no formar una pareja sáb-dom no intencional
            const esLunesTrasLibre = new Date(anio,mes-1,d).getDay()===1 && (forzadosLibre.includes(d-1) || forzadosDomingo.includes(d-1) || elegidosDescanso.includes(d-1));
            if(esLunesTrasLibre) continue;
            elegidosDescanso.push(d);
          }
          if(elegidosDescanso.length<descansosNecesarios){
            // último recurso: completar sin la restricción sáb-dom para no dejar a alguien con menos descanso del debido
            for(const d of ordenRotado){
              if(elegidosDescanso.length>=descansosNecesarios) break;
              if(!elegidosDescanso.includes(d)) elegidosDescanso.push(d);
            }
          }
        }

        const diasDescanso = [...yaForzados, ...elegidosDescanso];
        const diasTrabajo = semDias.filter(d=>!diasDescanso.includes(d));
        const patronHoras = patronHorasFT(diasTrabajo.length);
        const offsetPatron = patronHoras.length ? idxFT % patronHoras.length : 0;
        const patronRotado = [...patronHoras.slice(offsetPatron), ...patronHoras.slice(0,offsetPatron)];
        diasTrabajo.forEach((d,i)=>{ dayMap[d] = {horas: patronRotado[i], tipo:"trabajo"}; });
        diasDescanso.forEach(d=>{ dayMap[d] = {horas:0, tipo:"descanso"}; });
      });
      idxFT++;
    } else {
      // ===== PART-TIME: 25h/semana fijas (tope, no se puede pasar), énfasis en 8-9h fin de semana/festivos,
      // respetando la disponibilidad individual configurada (bloqueos por estudio) =====
      const bloqueados = (STATE.disponibilidadPT[p.id] && STATE.disponibilidadPT[p.id].diasBloqueados) || [];
      semanas.forEach((semDias, si)=>{
        const forzadosLibre = new Set(semDias.filter(d=>diasLibreForzados.has(d)));
        const disponibles = semDias.filter(d=> !forzadosLibre.has(d) && !bloqueados.includes(new Date(anio,mes-1,d).getDay()));
        const finde = disponibles.filter(d=>{ const w=new Date(anio,mes-1,d).getDay(); return w===0||w===6; });
        const entreSemana = disponibles.filter(d=>!finde.includes(d));
        const TOPE = 25;
        let total = 0;
        const asignados = {};

        finde.forEach((d,i)=>{
          if(total>=TOPE) return;
          const horas = Math.min((i+idxPT)%2===0 ? 9 : 8, TOPE-total);
          if(horas>0){ asignados[d]=horas; total+=horas; }
        });
        let wi = entreSemana.length ? idxPT % entreSemana.length : 0;
        let guard = 0;
        while(total<TOPE && entreSemana.length>0 && guard<entreSemana.length*3){
          const d = entreSemana[wi % entreSemana.length];
          if(!(d in asignados)){
            const horas = Math.min(guard%2===0?5:4, TOPE-total);
            if(horas>0){ asignados[d]=horas; total+=horas; }
          }
          wi++; guard++;
        }

        semDias.forEach(d=>{
          if(forzadosLibre.has(d) || bloqueados.includes(new Date(anio,mes-1,d).getDay())) dayMap[d] = {horas:0, tipo:"descanso"};
          else if(d in asignados) dayMap[d] = {horas:asignados[d], tipo:"trabajo"};
          else dayMap[d] = {horas:0, tipo:"descanso"};
        });
      });
      idxPT++;
    }
    const total = Object.values(dayMap).reduce((s,d)=>s+d.horas,0);
    grid[p.id] = {dias:dayMap, total};
  });
  return {dias, grid};
}

function drawHorarioGrid(anio, mes, params, resultado){
  const { dias, grid } = resultado;
  const personal = activeRoster().slice().sort((a,b)=> (a.rol===b.rol?0:(a.rol==='jefatura'?-1:1)) || a.nombre.localeCompare(b.nombre));
  const res = document.getElementById("hResultado");
  const headerDias = dias.map(d=>`<th class="${d.weekday===0||d.weekday===6?'sched-weekend':''}">${d.dia}<br>(${DIAS_SEMANA_CORTO[d.weekday]})</th>`).join("");
  const filas = personal.map(p=>{
    const info = grid[p.id] || {dias:{}, total:0};
    const celdas = dias.map(d=>{
      const c = info.dias[d.dia] || {horas:0, tipo:"descanso"};
      const valor = c.tipo==="descanso" ? "D" : c.horas;
      return `<td class="${d.weekday===0||d.weekday===6?'sched-weekend':''}"><input class="sched-cell" data-persona="${p.id}" data-dia="${d.dia}" value="${valor}"></td>`;
    }).join("");
    return `<tr>
      <td class="sched-name">${escapeHtml(p.nombre)}<div style="font-size:10px;color:var(--muted);font-weight:400;">${escapeHtml(p.cargo)}</div></td>
      ${celdas}
      <td class="sched-total" data-total-persona="${p.id}">${info.total}h</td>
    </tr>`;
  }).join("");

  res.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div style="font-size:12.5px;color:var(--muted);">Borrador editable — ajusta cualquier celda a mano (número de horas o "D" para descanso) antes de guardar o exportar.</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sm" id="hGuardarBtn">Guardar</button>
        <button class="btn-add" id="hExportarBtn">Exportar a Excel</button>
      </div>
    </div>
    <div class="sched-wrap">
      <table class="sched-table">
        <thead><tr><th class="sched-name-th">Nombre</th>${headerDias}<th>Total</th></tr></thead>
        <tbody id="schedBody">${filas}</tbody>
      </table>
    </div>
  `;

  function leerGridActual(){
    const nuevoGrid = {};
    personal.forEach(p=>{
      const dayMap = {};
      let total = 0;
      dias.forEach(d=>{
        const input = res.querySelector(`input[data-persona="${p.id}"][data-dia="${d.dia}"]`);
        const val = input ? input.value.trim() : "D";
        if(val.toUpperCase()==="D" || val===""){
          dayMap[d.dia] = {horas:0, tipo:"descanso"};
        } else {
          const horas = parseFloat(val)||0;
          dayMap[d.dia] = {horas, tipo:"trabajo"};
          total += horas;
        }
      });
      nuevoGrid[p.id] = {dias:dayMap, total};
    });
    return nuevoGrid;
  }

  res.querySelectorAll(".sched-cell").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const personaId = inp.dataset.persona;
      const filaTotales = res.querySelectorAll(`input[data-persona="${personaId}"]`);
      let total = 0;
      filaTotales.forEach(i=>{
        const v = i.value.trim();
        if(v.toUpperCase()!=="D" && v!=="") total += parseFloat(v)||0;
      });
      res.querySelector(`[data-total-persona="${personaId}"]`).textContent = total + "h";
    });
  });

  document.getElementById("hGuardarBtn").addEventListener("click", async ()=>{
    const key = anio+"-"+mes;
    STATE.horarios[key] = { params, grid: leerGridActual(), generadoPor: session.nombre, fechaGeneracion: todayStr() };
    await saveState("horarios");
    alert("Horario guardado.");
  });

  document.getElementById("hExportarBtn").addEventListener("click", ()=>{
    if(!window.XLSX){ alert("No se pudo cargar el generador de Excel. Intenta de nuevo."); return; }
    const gridActual = leerGridActual();
    const encabezado = ["Nombre","Cargo", ...dias.map(d=>`${d.dia} (${DIAS_SEMANA_CORTO[d.weekday]})`), "Total"];
    const filasAoa = [encabezado];
    personal.forEach(p=>{
      const info = gridActual[p.id] || {dias:{}, total:0};
      const fila = [p.nombre, p.cargo];
      dias.forEach(d=>{
        const c = info.dias[d.dia] || {horas:0, tipo:"descanso"};
        fila.push(c.tipo==="descanso" ? "D" : c.horas);
      });
      fila.push(info.total);
      filasAoa.push(fila);
    });
    const ws = XLSX.utils.aoa_to_sheet(filasAoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `${MESES[mes-1]} ${anio}`.slice(0,31));
    XLSX.writeFile(wb, `Horario_${MESES[mes-1]}_${anio}.xlsx`);
  });
}
