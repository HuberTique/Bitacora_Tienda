      <div><label>Nombre</label><input type="text" class="plNombre" data-i="${i}" value="${escapeHtml(p.nombre)}"></div>
      <div><label>URL</label><input type="text" class="plUrl" data-i="${i}" value="${escapeHtml(p.url)}" placeholder="https://..."></div>
      <div class="full"><label>Descripción</label><input type="text" class="plDesc" data-i="${i}" value="${escapeHtml(p.descripcion)}"></div>
      <div class="full">
        <label>Área asociada (opcional)</label>
        <select class="plArea" data-i="${i}">
          <option value="">— Ninguna en particular —</option>
          ${AREAS.map(a=>`<option value="${a.id}" ${p.area===a.id?'selected':''}>${a.label}</option>`).join("")}
        </select>
        <div class="field-hint">Si la asocias a un área, su enlace aparecerá directo al crear un pendiente de esa área en la Bitácora.</div>
      </div>
    </div>
  `).join("");
}

async function handleReglamentoUpload(e){
  const f = e.target.files[0]; if(!f) return;
  const base64 = await fileToBase64(f);
  const isImage = f.type.startsWith("image/");
  const reg = {id:uid(), nombre:f.name, fecha:todayStr(), estado:"analizando", resumen:"", sugerencias:[], subidoPor:session.nombre};
  STATE.reglamentos.unshift(reg);
  await saveState("reglamentos");
  drawReglamentos();

  const contentBlock = isImage
    ? { type:"image", source:{ type:"base64", media_type:f.type, data:base64 } }
    : { type:"document", source:{ type:"base64", media_type:"application/pdf", data:base64 } };

  const userContent = [
    contentBlock,
    { type:"text", text: "Este es un documento/reglamento interno de una tienda retail. Léelo y extrae parámetros relevantes para la gestión de pendientes y faltas del personal (por ejemplo: minutos de tolerancia, escalas disciplinarias, meses de vigencia de reincidencia, u otras reglas operativas). Responde ÚNICAMENTE con un JSON con las claves: resumen (string, hasta 60 palabras) y sugerencias (array de objetos {campo, valorSugerido, justificacion}). Si no encuentras parámetros claros, deja sugerencias como array vacío." }
  ];
  try{
    const text = await callClaude(userContent);
    const json = extractJson(text);
    reg.estado = "pendiente_revision";
    reg.resumen = json.resumen || "";
    reg.sugerencias = json.sugerencias || [];
  }catch(err){
    reg.estado = "error";
    reg.resumen = "No se pudo analizar automáticamente. Puedes revisarlo manualmente.";
  }
  await saveState("reglamentos");
  drawReglamentos();
}

function drawReglamentos(){
  const el = document.getElementById("regList");
  if(!STATE.reglamentos.length){ el.innerHTML = `<div class="empty">Aún no se han subido reglamentos.</div>`; return; }
  el.innerHTML = STATE.reglamentos.map(r=>`
    <div class="pendiente-row">
      <div class="top">
        <span class="titulo">${escapeHtml(r.nombre)}</span>
        <span class="estado-tag ${r.estado==='pendiente_revision'?'progreso':r.estado==='aprobado'?'cerrado':''}">${r.estado==='analizando'?'Analizando...':r.estado==='pendiente_revision'?'Revisar sugerencias':r.estado==='aprobado'?'Aprobado':'Error'}</span>
      </div>
      <div class="meta">Subido por ${escapeHtml(r.subidoPor)} · ${fmtDate(r.fecha)}</div>
      ${r.resumen ? `<div class="desc">${escapeHtml(r.resumen)}</div>` : ""}
      ${r.sugerencias && r.sugerencias.length ? `
        <div style="margin-top:8px;font-size:12.5px;">
          ${r.sugerencias.map(s=>`<div>• <strong>${escapeHtml(String(s.campo))}</strong>: ${escapeHtml(String(s.valorSugerido))} — <span style="color:var(--muted);">${escapeHtml(s.justificacion||"")}</span></div>`).join("")}
        </div>
        ${r.estado==='pendiente_revision' ? `<button class="btn-sm" style="margin-top:8px;" data-id="${r.id}" data-action="ok">Marcar como revisado</button>` : ""}
      ` : ""}
    </div>
  `).join("");
  el.querySelectorAll("[data-action='ok']").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const r = STATE.reglamentos.find(x=>x.id===btn.dataset.id);
      r.estado = "aprobado";
      await saveState("reglamentos");
      drawReglamentos();
    });
  });
}

/* ======================= VISTA ASESOR ======================= */
function renderMisPendientes(main){
  const pendientes = STATE.pendientes.filter(p=>p.asesor===session.nombre).sort((a,b)=>b.fechaCreacion.localeCompare(a.fechaCreacion));
  const tipos = STATE.faltasConfig.tipos;
  main.innerHTML = `
    <div class="main-header"><div><h2>Mis pendientes</h2><p>Lo que jefatura tiene registrado sobre ti (activos e historial).</p></div></div>
    <div class="card">
      <h3>Pendientes</h3>
      ${pendientes.length ? pendientes.map(p=>`
        <div class="pendiente-row" style="border-left-color:var(--${p.area})">
          <div class="top">
            <span class="badge ${p.area}">${AREAS.find(a=>a.id===p.area).label}</span>
            <span class="estado-tag ${p.estado==='cerrado'?'cerrado':p.estado==='progreso'?'progreso':''}">${p.estado==='abierto'?'Abierto':p.estado==='progreso'?'En progreso':'Cerrado'}</span>
          </div>
          <div class="titulo" style="margin-top:6px;">${escapeHtml(p.titulo)}</div>
          <div class="desc">${escapeHtml(p.descripcion)}</div>
        </div>
      `).join("") : `<div class="empty">No tienes pendientes registrados.</div>`}
    </div>
    <div class="card">
      <h3>Registro de feedbacks</h3>
      <div class="filters">
        <select id="mpTipoFiltro">
          <option value="">Todos los tipos</option>
          ${tipos.map(t=>`<option value="${t.id}">${escapeHtml(t.nombre)}</option>`).join("")}
        </select>
      </div>
      <div id="mpFeedbacksTabla" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById("mpTipoFiltro").addEventListener("input", drawMisFeedbacks);
  drawMisFeedbacks();
}

function drawMisFeedbacks(){
  const cont = document.getElementById("mpFeedbacksTabla");
  const tipoFiltro = document.getElementById("mpTipoFiltro")?.value || "";
  let retardos = STATE.retardos.filter(r=>r.asesor===session.nombre);
  if(tipoFiltro) retardos = retardos.filter(r=>r.tipoId===tipoFiltro);
  retardos.sort((a,b)=>b.fecha.localeCompare(a.fecha));

  cont.innerHTML = retardos.length ? `<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Minutos</th><th>Gravedad</th><th>Acción</th><th>Estado</th></tr></thead><tbody>
      ${retardos.map(r=>{
        const tipo = tipoFalta(r.tipoId);
        const grav = nivelGravedad(r.accion);
        return `<tr><td class="mono">${fmtDate(r.fecha)}</td><td>${escapeHtml(tipo?tipo.nombre:r.tipoId)}</td><td class="mono">${r.minutos!=null?r.minutos+" min":"—"}</td><td><span class="grav-badge grav-${grav.clase}"><span class="dot"></span>${grav.texto}</span></td><td>${escapeHtml(r.accion)}</td><td><span class="estado-tag ${r.estado==='realizada'?'activo':'progreso'}">${r.estado==='realizada'?'Realizada':'Pendiente'}</span></td></tr>`;
      }).join("")}
    </tbody></table>` : `<div class="empty">${tipoFiltro?'No tienes registros de este tipo.':'Sin registros de feedbacks.'}</div>`;
}

function renderAsistente(main){
  main.innerHTML = `
    <div class="main-header"><div><h2>Asistente</h2><p>Pregunta sobre tus pendientes, procedimientos o dónde consultar algo.</p></div></div>
    <div class="card">
      <div class="chat-wrap">
        <div class="chat-msgs" id="chatMsgs"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Escribe tu pregunta...">
          <button id="chatSend">Enviar</button>
        </div>
      </div>
      <div style="margin-top:12px;">
        ${STATE.plataformas.filter(p=>p.url).map(p=>`<a class="link-chip" href="${escapeHtml(p.url)}" target="_blank">🔗 ${escapeHtml(p.nombre)}</a>`).join("")}
      </div>
    </div>
  `;
  drawChat();
  document.getElementById("chatSend").addEventListener("click", sendChat);
  document.getElementById("chatInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") sendChat(); });
}
function drawChat(){
  const el = document.getElementById("chatMsgs");
  if(chatHistory.length===0){
    el.innerHTML = `<div class="chat-msg bot">Hola ${escapeHtml(session.nombre)}, puedes preguntarme por tus pendientes, el procedimiento de feedbacks y faltas, o dónde consultar algo (nómina, reglamento, etc.).</div>`;
    return;
  }
  el.innerHTML = chatHistory.map(m=>`<div class="chat-msg ${m.role==='user'?'user':'bot'}">${escapeHtml(m.text)}</div>`).join("");
  el.scrollTop = el.scrollHeight;
}
async function sendChat(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  chatHistory.push({role:"user", text});
  input.value = "";
  drawChat();
  const el = document.getElementById("chatMsgs");
  el.innerHTML += `<div class="chat-msg bot"><span class="loader"></span></div>`;
  el.scrollTop = el.scrollHeight;

  const misPendientes = STATE.pendientes.filter(p=>p.asesor===session.nombre);
  const misRetardos = STATE.retardos.filter(r=>r.asesor===session.nombre);
  const plataformasTxt = STATE.plataformas.map(p=>`- ${p.nombre}: ${p.url||"(sin url configurada)"} — ${p.descripcion}`).join("\n");
  const reglamentosTxt = STATE.reglamentos.filter(r=>r.estado==="aprobado").map(r=>`- ${r.nombre}: ${r.resumen}`).join("\n") || "Ninguno aprobado aún.";

  const sistema = `Eres el asistente interno de una tienda retail en Colombia, hablas con un asesor de tienda llamado ${session.nombre}. Responde en español, en tono cercano y breve (máximo 100 palabras). Usa solo la información de contexto dada; si no sabes algo, dilo y sugiere con quién hablar (su jefe/subjefe). Si preguntan dónde consultar algo, menciona la plataforma correspondiente de la lista.

Matriz de faltas vigente: ${STATE.faltasConfig.tipos.map(t=>`${t.nombre}: ${t.ladder.join(" → ")}`).join(" / ")}. Vigencia de reincidencia: ${STATE.faltasConfig.vigenciaMeses} meses.

Pendientes de este asesor:
${misPendientes.map(p=>`- [${p.estado}] ${p.titulo}`).join("\n") || "Ninguno"}

Feedbacks/faltas de este asesor:
${misRetardos.map(r=>`- ${r.fecha}: ${tipoFalta(r.tipoId)?.nombre||r.tipoId}, ${r.ocurrencia}ª vez → ${r.accion} [${r.estado}]`).join("\n") || "Ninguna"}

Plataformas disponibles:
${plataformasTxt}

Reglamentos aprobados:
${reglamentosTxt}`;

  try{
    const respuesta = await callClaude(text, sistema);
    chatHistory.push({role:"bot", text: respuesta});
  }catch(e){
    chatHistory.push({role:"bot", text:"No pude responder en este momento, intenta de nuevo."});
  }
  drawChat();
}

  await loadState();
  renderLoginNames();
})();
