<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --ink:#1B1F24;
    --muted:#5B6570;
    --paper:#EEF0EC;
    --panel:#FFFFFF;
    --line:#DBDED6;
    --brand:#223354;
    --brand-light:#3A517A;
    --rrhh:#7C5CBF;
    --visual:#D1487A;
    --operaciones:#1F8A70;
    --ventas:#D98A2B;
    --mantenimiento:#B4472A;
    --otros:#667085;
    --warn:#B4472A;
    --radius:10px;
    --fbnavy:#122446;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:var(--brand);}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px 32px;max-width:420px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .login-stamp{display:inline-block;transform:rotate(-3deg);border:2px solid var(--warn);color:var(--warn);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;padding:3px 10px;border-radius:4px;margin-bottom:14px;text-transform:uppercase;}
  .login-card h1{font-size:22px;margin:0 0 4px;}
  .login-card p.sub{color:var(--muted);margin:0 0 24px;font-size:13px;}
  .login-card p.store-name{color:var(--brand);margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
  .login-logo{width:56px;height:56px;border-radius:10px;display:block;margin-bottom:14px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .field select,.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .role-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .role-btn{flex:1;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:center;font-size:13px;font-weight:500;}
  .role-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-primary{width:100%;padding:12px;background:var(--brand);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:14px;}
  .btn-primary:hover{background:var(--brand-light);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .login-error{background:#FBEAE5;color:var(--warn);border:1px solid #F0C4B8;border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:none;}
  .login-hint{font-size:11.5px;color:var(--muted);margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  .app-wrap{display:flex;flex-direction:column;min-height:100vh;}
  .sidebar{width:100%;flex-shrink:0;background:var(--brand);color:#fff;display:flex;align-items:center;gap:24px;padding:0 28px;height:60px;flex-wrap:nowrap;overflow-x:auto;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid rgba(255,255,255,.15);flex-shrink:0;height:60px;}
  .sidebar-logo{width:34px;height:34px;border-radius:7px;flex-shrink:0;}
  .sidebar .brand h1{font-size:16px;margin:0;color:#fff;white-space:nowrap;}
  .sidebar .brand .who{font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap;}
  .store-name-sidebar{font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;}
  .tab-list{flex:1;display:flex;align-items:center;height:60px;overflow-x:auto;}
  .tab-item{display:flex;align-items:center;gap:10px;padding:0 16px;height:60px;color:rgba(255,255,255,.8);font-size:13.5px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;}
  .tab-item.active{background:rgba(255,255,255,.08);color:#fff;border-bottom-color:#fff;}
  .tab-item:hover{background:rgba(255,255,255,.06);}
  .side-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:16px;border-left:1px solid rgba(255,255,255,.15);}
  .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--warn);color:#fff;font-size:9.5px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:15px;text-align:center;line-height:1.3;}
  .notif-panel{position:absolute;top:60px;right:20px;width:340px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:60;display:none;}
  .notif-panel.show{display:block;}
  .notif-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .notif-item:hover{background:#F7F7F5;}
  .notif-item.unread{background:#F1F5FE;}
  .notif-item .notif-msg{font-size:13px;color:var(--ink);}
  .notif-item .notif-meta{font-size:11px;color:var(--muted);margin-top:3px;}
  .notif-empty{padding:20px;text-align:center;color:var(--muted);font-size:12.5px;}
  .notif-header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;}
  .side-btn{padding:8px 12px;text-align:center;background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:6px;font-size:12px;white-space:nowrap;}
  .side-btn:hover{background:rgba(255,255,255,.18);}

  .main{flex:1;padding:28px 34px;max-width:1100px;margin:0 auto;width:100%;}
  .main-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .main-header h2{font-size:22px;margin:0 0 4px;}
  .main-header p{margin:0;color:var(--muted);font-size:13px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 14px;font-size:15px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;color:#fff;}
  .badge.rrhh{background:var(--rrhh);}
  .badge.visual{background:var(--visual);}
  .badge.operaciones{background:var(--operaciones);}
  .badge.ventas{background:var(--ventas);}
  .badge.mantenimiento{background:var(--mantenimiento);}
  .badge.otros{background:var(--otros);}
  .badge.rolj{background:var(--brand);}
  .badge.rola{background:var(--otros);}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;}

  .pendiente-row{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:13px 15px;margin-bottom:10px;background:#fff;}
  .pendiente-row .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .pendiente-row .titulo{font-weight:600;font-size:14px;}
  .pendiente-row .meta{color:var(--muted);font-size:12px;margin-top:4px;}
  .pendiente-row .desc{margin-top:8px;font-size:13px;color:#333;}
  .estado-tag{font-size:11px;padding:2px 8px;border-radius:12px;background:#EDEEF0;color:var(--muted);font-weight:600;}
  .estado-tag.cerrado{background:#DFF3EA;color:#1F8A70;}
  .estado-tag.progreso{background:#FDF0DA;color:#B4772B;}
  .estado-tag.inactivo{background:#FBEAE5;color:var(--warn);}
  .estado-tag.activo{background:#DFF3EA;color:#1F8A70;}
  .grav-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;}
  .grav-badge .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .grav-verde{background:#DFF3EA;color:#1F8A70;}
  .grav-verde .dot{background:#1F8A70;}
  .grav-amarillo{background:#FDF0DA;color:#B4772B;}
  .grav-amarillo .dot{background:#D98A2B;}
  .grav-rojo{background:#FBEAE5;color:var(--warn);}
  .grav-rojo .dot{background:var(--warn);}

  .btn-sm{padding:6px 10px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);}
  .btn-sm:hover{background:#F5F5F3;}
  .btn-sm.danger{color:var(--warn);border-color:#F0C4B8;}
  .btn-add{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;}
  .form-grid textarea{resize:vertical;min-height:60px;}
  .field-hint{font-size:11px;color:var(--muted);margin-top:4px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,22,26,.5);align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .modal-close{float:right;background:none;border:none;font-size:18px;color:var(--muted);}

  .stamp{display:inline-block;transform:rotate(-2deg);border:1.5px solid var(--brand);color:var(--brand);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:4px;text-transform:uppercase;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);}

  .empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:8px;}

  .chat-wrap{display:flex;flex-direction:column;height:520px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:14px;background:#F8F8F6;border:1px solid var(--line);border-radius:8px 8px 0 0;}
  .chat-msg{max-width:80%;padding:9px 12px;border-radius:10px;margin-bottom:9px;font-size:13.5px;}
  .chat-msg.user{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:2px;}
  .chat-msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:2px;}
  .chat-input-row{display:flex;border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;}
  .chat-input-row input{flex:1;border:none;padding:12px;}
  .chat-input-row button{padding:0 18px;background:var(--brand);color:#fff;border:none;font-weight:600;}

  .link-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;margin:3px 4px 0 0;text-decoration:none;color:var(--ink);background:#fff;}
  .link-chip:hover{border-color:var(--brand);}

  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:0;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border-radius:20px;padding:5px 8px 5px 12px;font-size:12px;font-weight:500;}
  .chip-x{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .chip-x:hover{background:rgba(255,255,255,.35);}

  .loader{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .kv:last-child{border-bottom:none;}

  .file-drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;background:#FAFAF8;}
  .file-drop:hover{border-color:var(--brand);}

  .subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .subnav-btn{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .subnav-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}

  .sched-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
  .sched-table{border-collapse:collapse;font-size:11.5px;white-space:nowrap;}
  .sched-table th,.sched-table td{border:1px solid var(--line);padding:4px;text-align:center;}
  .sched-table th{background:#F4F5F2;color:var(--muted);font-weight:600;position:sticky;top:0;}
  .sched-table td.sched-name{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;z-index:2;min-width:150px;}
  .sched-table th.sched-name-th{position:sticky;left:0;background:#F4F5F2;z-index:3;min-width:150px;text-align:left;}
  .sched-table input.sched-cell{width:38px;border:none;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:4px 2px;background:transparent;}
  .sched-table input.sched-cell:focus{background:#FDF0DA;outline:2px solid var(--brand);}
  .sched-table td.sched-weekend{background:#F8F8F6;}
  .sched-table td.sched-total{font-weight:700;font-family:'IBM Plex Mono',monospace;background:#F4F5F2;}
  .sched-ok{color:#1F8A70;}
  .sched-warn{color:var(--warn);}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .cal-header h3{margin:0;font-size:16px;}
  .cal-nav{display:flex;gap:6px;align-items:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-daylabel{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 0;}
  .cal-day{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:96px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s;}
  .cal-day:hover{border-color:var(--brand);}
  .cal-day.other-month{background:#F7F7F5;opacity:.5;}
  .cal-day.blocked{background:repeating-linear-gradient(45deg,#FBEAE5,#FBEAE5 6px,#FDF3F0 6px,#FDF3F0 12px);border-color:#F0C4B8;}
  .cal-day.today{border-color:var(--brand);border-width:2px;}
  .cal-daynum{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .cal-daynum .blk-tag{font-size:9px;background:var(--warn);color:#fff;padding:1px 5px;border-radius:8px;font-weight:600;}
  .cal-chip{font-size:10px;padding:2px 5px;border-radius:5px;background:#EEF0EC;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--brand);}
  .cal-chip.tipo-dia_libre{border-left-color:#1F8A70;background:#E3F5EC;}
  .cal-chip.tipo-salida_temprano{border-left-color:#D98A2B;background:#FCF1DE;}
  .cal-chip.tipo-permiso{border-left-color:#7C5CBF;background:#EFE9FA;}
  .cal-chip.tipo-otro{border-left-color:#667085;background:#F0F1EF;}
  .cal-more{font-size:9.5px;color:var(--muted);}
  .req-audit{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;}

  .fbdoc{border:1px solid #999;background:#fff;font-size:13px;}
  .fbdoc-head{display:flex;align-items:stretch;border:2px solid var(--fbnavy);border-bottom:2px solid var(--fbnavy);}
  .fbdoc-head .fbdoc-logo{width:150px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:10px;border-right:2px solid var(--fbnavy);background:#fff;}
  .fbdoc-head .fbdoc-logo img{width:110px;height:auto;}
  .fbdoc-head .fbdoc-title{flex:1;background:var(--fbnavy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;}
  .fbdoc-row{display:grid;grid-template-columns:170px 1fr;border:1px solid #999;border-top:none;}
  .fbdoc-row .fbdoc-label{padding:7px 10px;font-weight:700;font-size:12.5px;border-right:1px solid #999;display:flex;align-items:center;}
  .fbdoc-row .fbdoc-value{padding:4px 10px;display:flex;align-items:center;}
  .fbdoc-row .fbdoc-value input{width:100%;border:none;font-size:13px;background:transparent;}
  .fbdoc-row .fbdoc-label2{border-left:1px solid #999;}
  .fbdoc-row-split{grid-template-columns:170px 1fr 190px 150px;}
  .fbdoc-banner{background:var(--fbnavy);color:#fff;font-size:12px;font-weight:700;text-transform:none;text-align:center;padding:6px;border:1px solid var(--fbnavy);border-top:none;}
  .fbdoc-box{border:1px solid #999;border-top:none;padding:0;}
  .fbdoc-box textarea{width:100%;border:none;padding:14px;font-size:13px;min-height:44px;font-family:inherit;resize:vertical;display:block;}
  .fbdoc-box textarea::placeholder{color:#ccc;font-size:18px;text-align:center;line-height:1.6;padding-top:20px;}
  .fbdoc-box-lg textarea{min-height:150px;}
  .fbdoc-box-thin textarea, .fbdoc-box-thin input{min-height:24px;padding:5px 10px;}
  .fbdoc-box-thin{padding:0;}
  .fbdoc-box-thin input{width:100%;border:none;font-size:13px;}
  .fbdoc-footer{display:grid;grid-template-columns:1fr 1fr;border:1px solid #999;border-top:none;}
  .fbdoc-footer .fbdoc-firma{padding:8px 12px;border-right:1px solid #999;}
  .fbdoc-footer .fbdoc-firma:last-child{border-right:none;}
  .fbdoc-footer .fbdoc-firma h4{font-size:12px;text-align:center;margin:4px 0;font-weight:700;}
  .fbdoc-footer .fbdoc-firma-space{height:55px;}
  .fbdoc-footer .fbdoc-firma-datos{font-size:12px;margin-top:2px;}
  .fbdoc-footer .fbdoc-firma input{border:none;border-bottom:1px solid #ccc;font-size:12px;width:65%;background:transparent;}

  @media(max-width:820px){
    .sidebar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px;row-gap:8px;}
    .sidebar .brand{border-right:none;padding-right:0;height:auto;flex:1;}
    .tab-list{display:flex;flex-wrap:wrap;height:auto;overflow-x:visible;order:3;flex-basis:100%;width:100%;gap:6px;}
    .tab-item{flex:1 1 auto;justify-content:center;height:38px;padding:0 10px;border-radius:7px;background:rgba(255,255,255,.08);border-bottom:none;}
    .tab-item.active{background:#fff;color:var(--brand);border-bottom:none;font-weight:600;}
    .side-actions{height:auto;padding-left:0;border-left:none;order:2;flex-shrink:0;}
    .side-btn{padding:7px 9px;font-size:11px;}
    .main{padding:18px;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

/* ======================= HASH / VALIDACIÓN DE CLAVE =======================
   Nota: esto es una ofuscación simple para el prototipo (sin backend real).
   No sustituye un sistema de autenticación con cifrado de nivel productivo. */
function hashClave(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){ hash = ((hash*33) ^ str.charCodeAt(i)) >>> 0; }
  return hash.toString(36);
}
function validaClave(clave, rol){
  if(rol==="jefatura"){
    return clave.length>=8 && /[A-Za-z]/.test(clave) && /[0-9]/.test(clave);
  }
  return /^[0-9]{4,6}$/.test(clave);
}
function reglaClaveTexto(rol){
  return rol==="jefatura"
    ? "Mínimo 8 caracteres, con letras y números."
    : "PIN numérico de 4 a 6 dígitos.";
}

async function loadState(){

    try{
      const res = await window.storage.get(k, true);
      if(res && res.value){ STATE[k] = JSON.parse(res.value); }
    }catch(e){ /* aún no existe la clave */ }
  }
  if(!STATE.roster || STATE.roster.length===0){
    STATE.roster = ROSTER_SEED.map((p,i)=>({

function monthsBetween(d1,d2){ return (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()); }
function monthsAgoStr(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return d.toISOString().slice(0,10); }
function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result.split(",")[1]);
    r.onerror = ()=> rej(new Error("No se pudo leer el archivo"));
    r.readAsDataURL(file);
  });
}
/* Reduce el tamaño de la imagen antes de enviarla a la IA (fotos de celular en alta resolución
   pueden pesar varios MB en base64 y hacer fallar la solicitud con "Failed to fetch"). */
function resizeImageParaIA(file, maxDim, calidad){
  maxDim = maxDim || 1600; calidad = calidad || 0.85;
  return new Promise((resolve, reject)=>{
    const lector = new FileReader();
    lector.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const escala = maxDim / Math.max(width, height);
          width = Math.round(width*escala);
          height = Math.round(height*escala);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", calidad);
        resolve({ base64: dataUrl.split(",")[1], mime: "image/jpeg" });
      };
      img.onerror = ()=> reject(new Error("No se pudo decodificar esta imagen (¿formato no compatible, como HEIC, o archivo dañado?)."));
      img.src = lector.result; // data: URL — evita bloqueos de blob: en entornos con política de seguridad estricta
    };
    lector.onerror = ()=> reject(new Error("No se pudo leer el archivo."));
    lector.readAsDataURL(file);
  });
}
/* Reintenta una vez si la falla es de red (fetch bloqueado o conexión inestable), antes de rendirse. */
async function callClaudeConReintento(userContent, systemPrompt){
  try{
    return await callClaude(userContent, systemPrompt);
  }catch(err){
    if(/failed to fetch|network/i.test(err.message)){
      await new Promise(r=>setTimeout(r, 1200));
      return await callClaude(userContent, systemPrompt);
    }
    throw err;
  }
}

/* ---------- Parser de la hoja "KPIS SEM." del presupuesto ---------- */
function parseKpisPeriodoRows(rows){
  const norm = s => (s==null?"":String(s)).trim().toLowerCase();
  const esVacio = v => v==null || v==="" || norm(v)==="#ref!";
  const colDe = (headerRow, ...opciones) => {
    for(let i=0;i<headerRow.length;i++){ if(opciones.includes(norm(headerRow[i]))) return i; }
    for(let i=0;i<headerRow.length;i++){ if(opciones.some(o=>norm(headerRow[i]).includes(o))) return i; }
    return -1;
  };
  const CARGOS_CONOCIDOS = {
    test(v){
      const u = String(v||"").trim().toUpperCase();
      if(!u) return false;
      return u.startsWith("CAJERO") || u.includes("FULLTIME") || u.includes("FULL TIME") || u.includes("FULL-TIME")
        || u.includes("PARTIME") || u.includes("PART TIME") || u.includes("PART-TIME")
        || u.startsWith("JEFE") || u.startsWith("SUBJEFE") || u.includes("SIN CARGO");
    }
  };
  // detecta las columnas de cargo/nombre validando contra una fila real de datos — en algunos archivos
  // la celda rotulada "NOMBRE" en realidad contiene el cargo, y el nombre va en la columna siguiente sin rótulo.
  function detectarColumnasPersona(header, rows, desdeIdx){
    let cCargo = colDe(header, "cargo");
    let cNombre = colDe(header, "nombre");
    if(cCargo<0 && cNombre>=0){
      let filaDatos = null;
      for(let k=desdeIdx; k<Math.min(desdeIdx+6, rows.length); k++){
        if(rows[k] && !esVacio(rows[k][cNombre])){ filaDatos = rows[k]; break; }
      }
      if(filaDatos && CARGOS_CONOCIDOS.test(String(filaDatos[cNombre]||"").trim())){
        cCargo = cNombre;
        cNombre = cNombre + 1;
      }
    }
    return { cCargo, cNombre };
  }

  let presupuestoTotal=null, horasLaboradasTotal=null, ventaPorHora=null;
  const periodoLabel = (rows[0] && rows[0][1]) ? String(rows[0][1]) : null;
  rows.forEach(r=>{
    if(!r) return;
    const b = norm(r[1]);
    if(b.startsWith("presupuesto ")) presupuestoTotal = r[3];
    if(b==="horas laboradas") horasLaboradasTotal = r[3];
    if(b.includes("vta x hora")) ventaPorHora = r[3];
  });
  if(ventaPorHora==null && presupuestoTotal && horasLaboradasTotal) ventaPorHora = presupuestoTotal/horasLaboradasTotal;

  // tabla 1: metas (presupuesto/horas) por persona — se detectan las columnas por su etiqueta, no por posición fija
  const metas = [];
  const i1 = rows.findIndex(r=> r && r.some(c=>norm(c)==="nombre") && r.some(c=>norm(c).includes("presupuesto")));
  if(i1>=0){
    const header = rows[i1];
    const { cCargo, cNombre } = detectarColumnasPersona(header, rows, i1+1);
    const cPresupuesto = header.findIndex(c=>norm(c).includes("presupuesto"));
    const cHoras = header.findIndex(c=>norm(c).includes("horas"));
    let vacias = 0;
    for(let i=i1+1; i<rows.length; i++){
      const r = rows[i];
      if(!r){ vacias++; if(vacias>3) break; continue; }
      const nombreVal = r[cNombre];
      if(norm(nombreVal)==="nombre") break; // se topó con otro encabezado: nueva tabla
      if(norm(nombreVal)==="total") break;
      if(esVacio(nombreVal) || typeof r[cPresupuesto]!=="number"){
        // fila rota (#REF!), de leyenda, o subencabezado: se salta sin cortar la tabla
        vacias++;
        if(vacias>3) break;
        continue;
      }
      if(cCargo>=0 && metas.length>0 && !CARGOS_CONOCIDOS.test(String(r[cCargo]||"").trim())){
        break; // ya salimos de la tabla de personas (ej. sección de reconocimientos más abajo)
      }
      vacias = 0;
      metas.push({
        cargo: cCargo>=0? String(r[cCargo]||"").trim() : "",
        nombre: String(nombreVal).trim(),
        presupuesto: r[cPresupuesto],
        horas: cHoras>=0? r[cHoras] : null,
      });
    }
  }

  // tabla 2: reales/cumplimiento por persona
  const reales = [];
  const i2Idx = rows.findIndex((r,idx)=> idx>i1 && r && r.some(c=>norm(c)==="nombre") && r.some(c=>norm(c)==="pto"));
  if(i2Idx>=0){
    const header = rows[i2Idx];
    const { cCargo, cNombre } = detectarColumnasPersona(header, rows, i2Idx+1);
    const cPto = colDe(header, "pto");
    const cBruto = header.findIndex(c=>norm(c).includes("acumulado bruto"));
    const cNeto = header.findIndex(c=>norm(c).includes("acumulado neto"));
    const cPct = colDe(header, "%");
    const cParesM = header.findIndex(c=>norm(c).includes("pares"));
    const cParesV = cParesM>=0 ? cParesM+1 : -1;
    const cAccM = header.findIndex(c=>norm(c).includes("acc"));
    const cAccV = cAccM>=0 ? cAccM+1 : -1;
    const cRopaM = header.findIndex(c=>norm(c).includes("ropa"));
    const cRopaV = cRopaM>=0 ? cRopaM+1 : -1;
    const cUnds = header.findIndex(c=>norm(c).includes("unds"));
    const cTrx = colDe(header, "trx");
    const cUpt = colDe(header, "upt");
    const cHorasTrab = header.findIndex(c=>norm(c).includes("horas trabajadas"));

    let vacias = 0;
    for(let i=i2Idx+1; i<rows.length; i++){
      const r = rows[i];
      if(!r){ vacias++; if(vacias>4) break; continue; }
      const nombreVal = r[cNombre];
      if(norm(nombreVal)==="nombre") break; // otro encabezado: nueva tabla
      if(esVacio(nombreVal)){
        // fila rota (#REF!), de leyenda, o subencabezado M/V: se salta sin cortar la tabla
        vacias++;
        if(vacias>4) break;
        continue;
      }
      if(cCargo>=0 && reales.length>0 && !CARGOS_CONOCIDOS.test(String(r[cCargo]||"").trim())){
        break; // ya salimos de la tabla de personas (ej. sección de reconocimientos más abajo)
      }
      vacias = 0;
      reales.push({
        cargo: cCargo>=0? String(r[cCargo]||"").trim() : "",
        nombre: String(nombreVal).trim(),
        pto: typeof r[cPto]==="number"? r[cPto] : null,
        acumuladoBruto: cBruto>=0 && typeof r[cBruto]==="number"? r[cBruto] : null,
        acumuladoNeto: cNeto>=0 && typeof r[cNeto]==="number"? r[cNeto] : null,
        cumplimiento: cPct>=0 && typeof r[cPct]==="number"? r[cPct] : null,
        paresVenta: cParesV>=0 && typeof r[cParesV]==="number"? r[cParesV] : null,
        accVenta: cAccV>=0 && typeof r[cAccV]==="number"? r[cAccV] : null,
        ropaVenta: cRopaV>=0 && typeof r[cRopaV]==="number"? r[cRopaV] : null,
        undsVendidas: cUnds>=0 && typeof r[cUnds]==="number"? r[cUnds] : null,
        trx: cTrx>=0 && typeof r[cTrx]==="number"? r[cTrx] : null,
        upt: cUpt>=0 && typeof r[cUpt]==="number"? r[cUpt] : null,
        horasTrabajadas: cHorasTrab>=0 && typeof r[cHorasTrab]==="number"? r[cHorasTrab] : null,
      });
    }
  }

  if(metas.length===0 && reales.length===0) return null;
  return { semanaLabel: periodoLabel, presupuestoSemanaTotal: presupuestoTotal, horasLaboradasTotal, ventaPorHora, metas, reales };
}
// alias retrocompatible (el nombre original se sigue usando en el resto de la app)
function parseKpisSemRows(rows){ return parseKpisPeriodoRows(rows); }

function nombreHojaKpis(wb, ...pistas){
  return wb.SheetNames.find(n=>{
    const u = n.toUpperCase();
    return u.includes("KPI") && pistas.some(p=>u.includes(p));
  }) || (pistas.length===0 ? wb.SheetNames.find(n=>n.toUpperCase().includes("KPI")) : null);
}
function parseKpisSem(wb){
  // primero intenta la hoja específicamente semanal ("KPIS SEM"); si no existe, cae a cualquier hoja "KPI" (archivos antiguos con una sola hoja)
  const nombreHoja = nombreHojaKpis(wb, "SEM") || wb.SheetNames.find(n => n.toUpperCase().includes("KPI"));
  if(!nombreHoja) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], {header:1, defval:null, raw:true});
  return parseKpisPeriodoRows(rows);
}
function parseKpisDia(wb){
  const nombreHoja = nombreHojaKpis(wb, "DIA", "DÍA");
  if(!nombreHoja) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], {header:1, defval:null, raw:true});
  const datos = parseKpisPeriodoRows(rows);
  if(datos){
    const fecha = celdaAFecha(rows[0] && rows[0][2]);
    if(fecha) datos.fechaExacta = fecha;
  }
  return datos;
}
function parseKpisMen(wb){

  if(!nombreHoja) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], {header:1, defval:null, raw:true});
  return parseKpisPeriodoRows(rows);
}

function excelSerialToISODate(serial){
  const utcDays = Math.floor(serial - 25569);
  const d = new Date(utcDays * 86400 * 1000);
  return d.toISOString().slice(0,10);
}
function celdaAFecha(v){
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==="number") return excelSerialToISODate(v);
  return null;
}

function parseTargetRows(rows){
  const norm = s => (s==null?"":String(s)).trim().toLowerCase();
  const out = { semanas: [], dias: [] };
  const valorDespuesDe = (row, idx) => {
    for(let j=idx+1; j<row.length; j++){ if(typeof row[j]==="number") return row[j]; }
    return null;
  };

  // tabla diaria: columna B = Fecha, C = Target, G = Real
  const iHeaderDias = rows.findIndex(r=> r && norm(r[1])==="fecha" && norm(r[2])==="target");
  if(iHeaderDias>=0){
    for(let i=iHeaderDias+1; i<rows.length; i++){
      const r = rows[i];
      if(!r || r[1]==null) break;
      const fecha = celdaAFecha(r[1]);
      if(!fecha) continue;
      out.dias.push({ fecha, target: typeof r[2]==="number"?r[2]:null, real: typeof r[6]==="number"?r[6]:null });
    }
  }

  rows.forEach(r=>{
    if(!r) return;
    r.forEach((cell, idx)=>{
      const t = norm(cell);
      if(!t) return;
      if(t==="target real") out.targetMensual = valorDespuesDe(r, idx);
      else if(t==="venta actual") out.ventaActual = valorDespuesDe(r, idx);
      else if(t==="meta vs aa %") out.metaVsAnioAnteriorPct = valorDespuesDe(r, idx);
      else if(t==="% vs target") out.incentivoVsTarget = valorDespuesDe(r, idx);
      else if(t==="% vs año ant") out.incentivoVsAnioAnt = valorDespuesDe(r, idx);
      else if(t==="valor final") out.incentivoFinal = valorDespuesDe(r, idx);
      else if(t==="proyección $") out.proyeccionValor = valorDespuesDe(r, idx);
      else if(t==="proyección % tgt") out.proyeccionPct = valorDespuesDe(r, idx);
      else if(t==="var tgt %" && out.varTgtMensualPct===undefined && idx>13) out.varTgtMensualPct = valorDespuesDe(r, idx);
      else if(/^semana \d/.test(t) && typeof r[idx+1]==="number"){
        out.semanas.push({ label: String(cell), target: r[idx+1], real: typeof r[idx+4]==="number"? r[idx+4] : null });
      } else if(t==="total" && typeof r[idx+1]==="number"){
        out.totalSemanas = { target: r[idx+1], real: typeof r[idx+4]==="number"? r[idx+4] : null };
      }
    });
  });
  if(out.targetMensual==null && out.ventaActual==null && out.semanas.length===0 && out.dias.length===0) return null;
  return out;
}
function parseTarget(wb){
  const nombreHoja = wb.SheetNames.find(n => n.toUpperCase().includes("TARGET"));
  if(!nombreHoja) return null;
  const ws = wb.Sheets[nombreHoja];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  return parseTargetRows(rows);
}

function parseRepVentaRows(rows){
  const norm = s => (s==null?"":String(s)).trim().toLowerCase();
  const out = {};
  rows.forEach(r=>{
    if(!r) return;
    const b = norm(r[0]);
    // formato antiguo (RepVenta)
    if(b==="presupuesto") out.presupuesto = r[1];
    if(b==="venta") out.venta = r[1];
    if(b==="cumplimiento" && out.cumplimiento==null) out.cumplimiento = r[1];
    if(b==="accesorios" || b.includes("venta de accesorios")) out.accesorios = r[1];
    if(b==="ropa" || b.includes("venta de ropa")) out.ropa = r[1];
    if(b==="responsable" || b.includes("responsable")) out.responsable = r[1];
    // formato nuevo (REP_DIARIO)
    if(b.includes("objetivo de venta")) out.presupuesto = r[1];
    if(b.includes("venta del dia") || b.includes("venta del día")) out.venta = r[1];
    if(b.includes("objetivo de accesorio")) out.objetivoAccesorios = r[1];
    if(b.includes("objetivo de ropa")) out.objetivoRopa = r[1];
  });
  if(out.presupuesto==null && out.venta==null) return null;
  return out;
}
function parseRepVenta(wb){
  const nombreHoja = wb.SheetNames.find(n => { const u=n.toUpperCase(); return u.includes("REPVENTA") || u.includes("REP_DIARIO") || u.includes("REP DIARIO"); });
  if(!nombreHoja) return null;
  const ws = wb.Sheets[nombreHoja];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  return parseRepVentaRows(rows);
}

function tipoFalta(id){ return STATE.faltasConfig.tipos.find(t=>t.id===id); }
function computeOcurrencia(asesor, tipoId, fecha){
  const vigencia = STATE.faltasConfig.vigenciaMeses;
  const ref = new Date(fecha+"T00:00:00");
  const previos = STATE.retardos.filter(r => r.asesor===asesor && r.tipoId===tipoId && new Date(r.fecha+"T00:00:00") <= ref && monthsBetween(new Date(r.fecha+"T00:00:00"), ref) <= vigencia);
  const tipo = tipoFalta(tipoId);
  const n = previos.length + 1;
  const accion = tipo.ladder[Math.min(n-1, tipo.ladder.length-1)];
  return { ocurrencia: n, accion };
}

/* ======================= CLAUDE API HELPER ======================= */
async function callClaude(userContent, systemPrompt){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: [{ role: "user", content: userContent }],
  };
  if(systemPrompt) body.system = systemPrompt;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(!resp.ok || data.error){
    throw new Error(data?.error?.message || `Error de la API (${resp.status})`);
  }
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(!text) throw new Error("La IA no devolvió texto en la respuesta.");
  return text;
}
function extractJson(text){
  const clean = text.replace(/```json|```/g,"").trim();
  const start = clean.indexOf("{");
  if(start===-1) throw new Error("Sin JSON en la respuesta");
  const finReal = clean.lastIndexOf("}");
  const end = finReal!==-1 ? finReal : clean.length-1; // si no hay ni una llave de cierre (corte muy severo), se usa todo el texto disponible
  const candidato = clean.slice(start, end+1);
  try{
    return JSON.parse(candidato);
  }catch(e){
    // la respuesta pudo haberse cortado a mitad de un arreglo largo (límite de longitud de la respuesta).
    // se intenta recuperar los elementos completos que sí llegaron, en vez de descartar todo.
    const reparado = repararJsonTruncado(candidato);
    if(reparado){
      try{
        const obj = JSON.parse(reparado);
        obj.__truncado = true; // marca para que el llamador avise que la lista puede venir incompleta
        return obj;
      }catch(e2){ /* sigue sin poder repararse */ }
    }
    throw new Error("No se pudo interpretar la respuesta de la IA (posiblemente se cortó por traer demasiados datos). Intenta con menos personas por imagen, o divide el reporte en varias fotos.");
  }
}
/* Repara un JSON truncado a mitad de un arreglo: conserva los elementos completos y cierra los
   corchetes/llaves que quedaron abiertos, en vez de perder todo el resultado por un corte parcial. */
function repararJsonTruncado(str){
  let inString = false, escape = false;
  const stack = [];
  let ultimoCorteSeguro = -1;
  let stackEnCorte = null;
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    if(escape){ escape=false; continue; }
    if(ch==="\\" && inString){ escape=true; continue; }
    if(ch==='"'){ inString = !inString; continue; }
    if(inString) continue;
    if(ch==="{" || ch==="["){ stack.push(ch); }
    else if(ch==="}" || ch==="]"){
      stack.pop();
      // si tras cerrar quedamos dentro de "objeto raíz -> arreglo", acabamos de completar
      // un elemento entero del arreglo (sea {objeto} o [arreglo compacto]): punto seguro para cortar aquí.
      if(stack.length===2){ ultimoCorteSeguro = i; stackEnCorte = stack.slice(); }
    }
  }
  if(ultimoCorteSeguro===-1) return null;
  let resultado = str.slice(0, ultimoCorteSeguro+1);
  for(let i=stackEnCorte.length-1;i>=0;i--){ resultado += stackEnCorte[i]==="{" ? "}" : "]"; }
  return resultado;
}

function notificacionesParaUsuario(){
  return STATE.notificaciones.filter(n =>
    n.destinatario===session.nombre || (n.destinatario==="jefatura" && session.rol==="jefatura")
  ).sort((a,b)=> b.fecha.localeCompare(a.fecha));
}
async function crearNotificacion({tipo, destinatario, mensaje, refFecha}){
  STATE.notificaciones.push({
    id: uid(), tipo, destinatario, mensaje, refFecha: refFecha||null,
    fecha: todayStr(), leida: false,
  });
  await saveState("notificaciones");
  dibujarBadgeNotificaciones();
}
function dibujarBadgeNotificaciones(){
  const badge = document.getElementById("notifBadge");
  if(!session || !badge) return;
  const noLeidas = notificacionesParaUsuario().filter(n=>!n.leida).length;
  badge.style.display = noLeidas>0 ? "inline-block" : "none";
  badge.textContent = noLeidas>9 ? "9+" : String(noLeidas);
}
function toggleNotifPanel(){
  const panel = document.getElementById("notifPanel");
  if(panel.classList.contains("show")){ panel.classList.remove("show"); return; }
  const lista = notificacionesParaUsuario();
  panel.innerHTML = `
    <div class="notif-header"><span>Notificaciones</span>${lista.some(n=>!n.leida)?`<button class="btn-sm" id="notifMarcarTodas" style="padding:3px 8px;">Marcar todas leídas</button>`:""}</div>
    ${lista.length===0 ? `<div class="notif-empty">No tienes notificaciones.</div>` : lista.map(n=>`
      <div class="notif-item ${n.leida?'':'unread'}" data-id="${n.id}" data-fecha="${n.refFecha||''}">
        <div class="notif-msg">${escapeHtml(n.mensaje)}</div>
        <div class="notif-meta">${fmtDate(n.fecha)}</div>
      </div>
    `).join("")}
  `;
  panel.classList.add("show");
  panel.querySelectorAll(".notif-item").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const n = STATE.notificaciones.find(x=>x.id===el.dataset.id);
      if(n && !n.leida){ n.leida = true; await saveState("notificaciones"); dibujarBadgeNotificaciones(); el.classList.remove("unread"); }
      if(el.dataset.fecha && activeTab==="requerimientos"){ panel.classList.remove("show"); abrirDiaRequerimiento(el.dataset.fecha); }
    });
  });
  const btnTodas = document.getElementById("notifMarcarTodas");
  if(btnTodas){
    btnTodas.addEventListener("click", async (e)=>{
      e.stopPropagation();
      notificacionesParaUsuario().forEach(n=> n.leida = true);
      await saveState("notificaciones");
      dibujarBadgeNotificaciones();
      toggleNotifPanel(); toggleNotifPanel();
    });
  }
}

    if(activeTab==="bitacora") return renderBitacora(main);
    if(activeTab==="feedbacks") return renderRetardos(main);
    if(activeTab==="requerimientos") return renderRequerimientos(main);
    if(activeTab==="reportes") return renderReportes(main);
    if(activeTab==="historial") return renderHistorial(main);
    if(activeTab==="config") return renderConfig(main);
  } else {
    if(activeTab==="mis_pendientes") return renderMisPendientes(main);

    if(activeTab==="reportes") return renderReportes(main);
    if(activeTab==="asistente") return renderAsistente(main);
  }
}

function drawPendientesList(){
  const area = document.getElementById("fArea")?.value || "";
  const estado = document.getElementById("fEstado")?.value || "";
  const q = (document.getElementById("fBuscar")?.value || "").toLowerCase();
  let list = STATE.pendientes.filter(p=>p.estado!=="cerrado");
  list.sort((a,b)=> b.fechaCreacion.localeCompare(a.fechaCreacion));
  if(area) list = list.filter(p=>p.area===area);
  if(estado) list = list.filter(p=>p.estado===estado);
  if(q) list = list.filter(p => (p.titulo+p.descripcion+p.responsable+(p.asesor||"")).toLowerCase().includes(q));
  const el = document.getElementById("pendientesList");
  if(list.length===0){ el.innerHTML = `<div class="empty">No hay pendientes activos que coincidan con el filtro.</div>`; return; }
  el.innerHTML = list.map(p=>pendienteRowHtml(p)).join("");
  el.querySelectorAll("[data-action='detail']").forEach(btn=>{
    btn.addEventListener("click", ()=> openPendienteDetail(btn.dataset.id));
  });
}

/* ---------- Lector de imágenes de atrasos (GeoVictoria y similares) ---------- */
function normTxt(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z\s]/g,"").trim();
}
function matchPersonaPorNombre(nombreDetectado){
  const tokensDet = normTxt(nombreDetectado).split(/\s+/).filter(t=>t.length>2);
  if(tokensDet.length===0) return null;
  let mejor = null, mejorScore = 0;
  activeRoster().forEach(p=>{
    const tokensP = normTxt(p.nombre).split(/\s+/).filter(t=>t.length>2);
    const score = tokensP.filter(t=>tokensDet.includes(t)).length;
    if(score>mejorScore){ mejorScore = score; mejor = p; }
  });
  return mejorScore>0 ? mejor : null;
}
function matchPersonaPorCodigo(codigoDetectado){
  const cod = String(codigoDetectado||"").trim();
  if(!cod) return null;
  // si jefatura ya reasignó este ID a otra persona (caso de empleado nuevo usando el ID de otro), eso manda
  const reasignadoA = STATE.idReasignaciones[cod];
  if(reasignadoA){
    const p = findPersona(reasignadoA);
    if(p && p.activo) return p;
  }
  return activeRoster().find(p=> p.codigo && String(p.codigo).trim()===cod) || null;
}
function guardarReasignacionId(codigoDetectado, personaId){
  const cod = String(codigoDetectado||"").trim();
  if(!cod || !personaId) return;
  STATE.idReasignaciones[cod] = personaId;
}
/* Prioriza el ID de empleado (inequívoco) y solo recurre al nombre si no hay ID o no coincide con nadie. */
function matchPersonaPorCodigoONombre(codigoDetectado, nombreDetectado){
  return matchPersonaPorCodigo(codigoDetectado) || matchPersonaPorNombre(nombreDetectado);
}
function nivelGravedad(accion){
  const a = (accion||"").toLowerCase();
  if(a.includes("descargo")) return {clase:"rojo", texto:"Grave"};
  if(a.includes("escrito")) return {clase:"amarillo", texto:"Reincidencia"};
  if(a.includes("verbal")) return {clase:"verde", texto:"Primera vez"};
  return {clase:"amarillo", texto:"Seguimiento"};
}
function tipoIdPorMinutos(min){
  const tipos = STATE.faltasConfig.tipos;
  let candidato;
  if(min<10) candidato = tipos.find(t=>t.id==="llegada_menor10");
  else if(min<45) candidato = tipos.find(t=>t.id==="llegada_10_45");
  else candidato = tipos.find(t=>t.id==="llegada_mayor45");
  if(!candidato) candidato = tipos.find(t=>t.requiereMinutos);
  return candidato ? candidato.id : (tipos[0] ? tipos[0].id : null);
}

async function handleImagenesRetardo(e){
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  e.target.value = "";

  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Leyendo imagen(es)...</h3>
    <div id="lecturaLoading"><span class="loader"></span> Analizando ${files.length} imagen(es), esto puede tardar unos segundos...</div>
  `);

  const sistema = "Eres un asistente que extrae datos de reportes de asistencia/atrasos de un sistema de control de horario (tipo GeoVictoria) de una tienda retail en Colombia. Analiza la imagen (puede traer muchas personas o varios días) y responde ÚNICAMENTE con un JSON compacto: {\"registros\":[[nombre,fecha,minutos], ...]}. Cada elemento es un arreglo de 3 valores (NO un objeto, para ahorrar espacio): [0]=nombre completo de la persona tal como aparece en la imagen (apellidos y nombres), [1]=fecha en formato YYYY-MM-DD (la imagen puede traer DD-MM-YYYY o DD/MM/YYYY, conviértelas), [2]=minutos de atraso como número entero. Incluye SOLO llegadas tarde reales (minutos de atraso mayor a 0, con hora de llegada posterior al inicio de turno o marcada explícitamente como 'Atraso'). Ignora días sin atraso, sin planificar, en descanso, o sin marcación. Incluye a TODAS las personas/días con atraso que veas, sin quedarte corto — es más importante incluir a todos que dar detalle extra. Si no encuentras ninguna llegada tarde, responde con registros como arreglo vacío. No agregues texto fuera del JSON.";

  let todos = [];
  let errores = [];
  let huboTruncamiento = false;
  for(const f of files){
    try{
      if(!/^image\/(jpeg|jpg|png|gif|webp)$/i.test(f.type)){
        throw new Error(`Formato "${f.type||'desconocido'}" no soportado. Usa JPG, PNG, GIF o WEBP (las fotos de iPhone en formato HEIC no funcionan — cámbialas a "Más compatible" en Ajustes > Cámara > Formatos, o conviértelas antes de subirlas).`);
      }
      let base64, mime;
      try{
        ({ base64, mime } = await resizeImageParaIA(f));
      }catch(errResize){
        // si la compresión falla por cualquier motivo, se intenta con la imagen original sin modificar
        base64 = await fileToBase64(f);
        mime = f.type;
      }
      const userContent = [
        { type:"image", source:{ type:"base64", media_type: mime, data: base64 } },
        { type:"text", text:"Extrae los registros de llegada tarde de esta imagen, en el formato compacto de arreglos indicado." }
      ];
      const text = await callClaudeConReintento(userContent, sistema);
      const json = extractJson(text);
      if(json.__truncado) huboTruncamiento = true;
      if(Array.isArray(json.registros)){
        json.registros.forEach(reg=>{
          if(Array.isArray(reg)) todos.push({ nombre: reg[0]||"", fecha: reg[1]||"", minutos: reg[2] });
          else if(reg && typeof reg==="object") todos.push(reg); // por si la IA igual responde en formato objeto
        });
      }
    }catch(err){
      const msg = /failed to fetch/i.test(err.message)
        ? "no se pudo conectar con la IA (falla de red). Revisa tu conexión a internet e intenta de nuevo — si la imagen es muy pesada, tómale una captura de pantalla en vez de subir la foto original."
        : err.message;
      errores.push(`${f.name}: ${msg}`);
    }
  }

  if(todos.length===0){
    openModal(`
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>Leer desde imagen</h3>
      <div class="empty">No se encontraron llegadas tarde en la(s) imagen(es).</div>
      ${errores.length ? `<div class="login-error" style="display:block;margin-top:10px;">${errores.map(escapeHtml).join("<br>")}</div>` : ""}
    `);
    return;
  }

  mostrarRevisionImagen(todos, errores, huboTruncamiento);
}

function mostrarRevisionImagen(registrosDetectados, errores, huboTruncamiento){
  const personal = activeRoster();
  const filasHtml = registrosDetectados.map((r,i)=>{
    const match = matchPersonaPorNombre(r.nombre);
    const opciones = personal.map(p=>`<option value="${escapeHtml(p.nombre)}" ${match && match.id===p.id?'selected':''}>${escapeHtml(p.nombre)}</option>`).join("");
    return `
      <tr data-row="${i}">
        <td><input type="checkbox" class="revChk" data-i="${i}" checked></td>
        <td style="font-size:11.5px;color:var(--muted);">${escapeHtml(r.nombre||"—")}${!match?' <span style="color:var(--warn);">(sin coincidencia)</span>':''}</td>
        <td><select class="revPersona" data-i="${i}"><option value="">— selecciona —</option>${opciones}</select></td>
        <td><input type="date" class="revFecha" data-i="${i}" value="${escapeHtml(r.fecha||todayStr())}"></td>
        <td><input type="number" class="revMinutos" data-i="${i}" value="${parseInt(r.minutos)||0}" min="1" style="width:60px;"></td>
      </tr>`;
  }).join("");

  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Revisar llegadas tarde detectadas</h3>
    <p style="color:var(--muted);font-size:12.5px;">Revisa que la persona esté bien asignada antes de registrar.${errores && errores.length ? ` ${errores.length} imagen(es) no se pudieron leer (detalle abajo).` : ""}</p>
    ${huboTruncamiento ? `<div class="login-error" style="display:block;">⚠️ La respuesta de la IA venía muy larga y se cortó — se recuperaron los registros completos que sí alcanzaron a llegar (${registrosDetectados.length}), pero puede faltar alguno. Revisa contra la imagen original.</div>` : ""}
    ${errores && errores.length ? `<div class="login-error" style="display:block;">${errores.map(escapeHtml).join("<br>")}</div>` : ""}
    <div style="overflow-x:auto;">
      <table style="font-size:12.5px;">
        <thead><tr><th></th><th>Detectado</th><th>Persona</th><th>Fecha</th><th>Minutos</th></tr></thead>
        <tbody id="revBody">${filasHtml}</tbody>
      </table>
    </div>
    <button class="btn-primary" style="margin-top:16px;" id="revRegistrar">Registrar seleccionados</button>
  `);

  document.getElementById("revRegistrar").addEventListener("click", async ()=>{
    const filas = document.querySelectorAll("#revBody tr");
    let creados = 0, saltados = 0;
    for(const fila of filas){
      const i = fila.dataset.row;
      const chk = fila.querySelector(".revChk");
      if(!chk.checked) continue;
      const asesor = fila.querySelector(".revPersona").value;
      const fecha = fila.querySelector(".revFecha").value;
      const minutos = parseInt(fila.querySelector(".revMinutos").value)||0;
      if(!asesor || !fecha || minutos<=0){ saltados++; continue; }
      const tipoId = tipoIdPorMinutos(minutos);
      if(!tipoId){ saltados++; continue; }
      const info = computeOcurrencia(asesor, tipoId, fecha);
      STATE.retardos.push({id:uid(), asesor, tipoId, fecha, minutos, obs:"Registrado automáticamente desde imagen (control de horario).", ocurrencia:info.ocurrencia, accion:info.accion, estado:"pendiente", registradoPor:session.nombre});
      creados++;
    }
    if(creados>0) await saveState("retardos");
    closeModal();
    if(activeTab==="feedbacks") drawRetardos();
    if(saltados>0) alert(`Se registraron ${creados}. ${saltados} se omitieron por falta de persona/fecha/minutos.`);
  });
}

function filterRetardos(opts){
  opts = opts || {};
  const {asesor="", tipoId="", estado="", desde="", hasta=""} = opts;
  let list = [...STATE.retardos];
  if(asesor) list = list.filter(r=>r.asesor===asesor);
  if(tipoId) list = list.filter(r=>r.tipoId===tipoId);
  if(estado) list = list.filter(r=>r.estado===estado);
  if(desde) list = list.filter(r=>r.fecha>=desde);
  if(hasta) list = list.filter(r=>r.fecha<=hasta);
  return list;
}

function drawRetardos(){
  const fAsesor = document.getElementById("rfAsesor")?.value || "";

    totalWrap.innerHTML = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">

    totalWrap.innerHTML = "";

  const body = document.getElementById("retBody");

    return `

      <td><button class="btn-sm" data-action="doc" data-id="${r.id}">Generar documento</button></td>

async function generarDocumentoRetardo(id){
  const r = STATE.retardos.find(x=>x.id===id);
  const tipo = tipoFalta(r.tipoId);

  const jefePersona = findPersona(session.id);

  // si ya existe un borrador guardado para este registro, se abre directamente sin volver a llamar la IA
  if(r.feedbackDoc){
    dibujarFormatoFeedback(r, r.feedbackDoc, persona, jefePersona);

  openModal(`

async function generarTextoFeedback(r, tipo){
  const esLlegadaTarde = (tipo.id||"").startsWith("llegada");
  const sistema = "Eres un profesional de recursos humanos de una tienda retail en Colombia (Skechers) que redacta el contenido de un 'Formato de Feedback' oficial en papel, listo para entregarse físicamente al colaborador. Escribe como se escribiría a mano en ese formato impreso: lenguaje natural de recursos humanos, con los hechos concretos (fechas, horas, nombres) que se te den. NUNCA menciones software, sistemas, aplicaciones, bases de datos, 'matriz de faltas', 'ocurrencia', 'vigencia', 'bitácora' ni ningún término técnico o administrativo interno — eso es información de gestión interna que nunca debe aparecer en el documento que lee el colaborador. Responde ÚNICAMENTE con un JSON con las claves: situacion (string, MUY PUNTUAL Y BREVE, máximo 25 palabras, UNA sola frase directa que indique qué pasó, cuándo y el dato concreto — sin rodeos, sin justificaciones, sin adjetivos, solo el hecho objetivo; ejemplo de tono esperado: 'Llegada tarde de 2 minutos al turno de las 13:30 del 20 de julio de 2026, segunda vez en el periodo.'), comentarioJefe (string, hasta 90 palabras, escrito en PRIMERA PERSONA por el jefe inmediato dirigiéndose al colaborador — un comentario cercano pero profesional que dé contexto práctico y prevención a futuro; por ejemplo, si es una llegada tarde, puede recordar que el horario se publica todos los viernes con anticipación para que el colaborador pueda programarse y evitar este tipo de situaciones) y planAccion (string, hasta 70 palabras, compromisos concretos y verificables de ambas partes). No inventes hechos que no estén en los datos dados.";
  const prompt = `Situación a documentar (uso interno para redactar, no debe aparecer citado literalmente):\n- Motivo general: ${tipo.nombre}\n- Colaborador: ${r.asesor}\n- Fecha del hecho: ${fmtDate(r.fecha)}\n${r.minutos!=null?`- Minutos de retraso: ${r.minutos}\n`:""}- Es una reincidencia: ${r.ocurrencia>1 ? "sí, van "+r.ocurrencia+" veces en el periodo reciente" : "no, es la primera vez"}\n- Contexto de la situación dado por jefatura: ${r.obs || "sin contexto adicional, básate solo en los datos anteriores"}\n${esLlegadaTarde?"- Recuerda: el horario de la tienda se publica todos los viernes con anticipación para la semana siguiente.":""}\n\nGenera el JSON solicitado.`;

  let situacion = r.obs || "", comentarioJefe = "", planAccion = "";
  try{
    const text = await callClaude(prompt, sistema);
    const json = extractJson(text);
    situacion = json.situacion || situacion;
    comentarioJefe = json.comentarioJefe || "";
    planAccion = json.planAccion || "";
  }catch(e){ /* si falla la IA, se deja el borrador editable vacío para llenar a mano */ }
  return { situacion, comentarioJefe, comentarioEmpleado:"", planAccion, fechaCierre:"" };
}

/* ---------- Generación del PDF real, escribiendo sobre la plantilla oficial ---------- */
const PF_PAGE_W = 595.32, PF_PAGE_H = 841.92; // tamaño exacto de la plantilla (A4)
function pfToPdfY(fitzY){ return PF_PAGE_H - fitzY; }

async function generarPdfFeedback(){
  const v = id => document.getElementById(id)?.value || "";
  if(!window.PDFLib){ alert("No se pudo cargar el generador de PDF. Espera un momento e intenta de nuevo."); return; }
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;

  const bytes = Uint8Array.from(atob(PDF_FEEDBACK_TEMPLATE_B64), c=>c.charCodeAt(0));
  const pdfDoc = await PDFDocument.load(bytes);
  const page = pdfDoc.getPage(0);
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const black = rgb(0.08,0.08,0.08);
  const white = rgb(1,1,1);

  function drawLine(text, x, yBaseline, size){
    if(!text) return;
    page.drawText(String(text), {x, y:pfToPdfY(yBaseline), size:size||10, font, color:black});
  }
  function whiteOut(x0, yTopFitz, x1, yBottomFitz){
    page.drawRectangle({x:x0, y:pfToPdfY(yBottomFitz), width:x1-x0, height:yBottomFitz-yTopFitz, color:white});
  }
  function drawWrapped(text, box){
    if(!text) return;
    const words = String(text).split(/\s+/).filter(Boolean);
    let lines=[], cur="";
    words.forEach(w=>{
      const test = cur? cur+" "+w : w;
      if(font.widthOfTextAtSize(test, box.fontSize) > box.maxWidth && cur){ lines.push(cur); cur=w; } else cur = test;
    });
    if(cur) lines.push(cur);
    lines.forEach((line,i)=>{
      const fitzLineY = box.yTop + box.fontSize + i*box.lineHeight;
      page.drawText(line, {x:box.x, y:pfToPdfY(fitzLineY), size:box.fontSize, font, color:black});
    });
  }

  // campos de la tabla superior
  drawLine(fmtDate(v("fbFecha")), 120, 114.56, 10);
  drawLine(v("fbArea"), 120, 134.36, 10);
  drawLine(v("fbNombreTrab"), 120, 156.68, 10);
  drawLine(v("fbCedulaTrab"), 480, 162.44, 10);

  // motivo del feedback: se tapa el texto fantasma "Descripción de la Situación" antes de escribir
  whiteOut(25, 193, 561, 314.5);
  drawWrapped(v("fbSituacion"), {x:40, yTop:196, maxWidth:500, fontSize:9.5, lineHeight:12});

  drawWrapped(v("fbComentJefe"), {x:40, yTop:341, maxWidth:500, fontSize:9.5, lineHeight:12});

async function generarPlanTrabajoConIA(){
  const personal = activeRoster();
  const idsSeleccionados = window.__ptSeleccionados || [];
  const seleccionados = idsSeleccionados.map(id=>personal.find(p=>p.id===id)).filter(Boolean);
  const libre = document.getElementById("ptResponsableLibre").value.trim();
  const contexto = document.getElementById("ptContexto").value.trim();
  const fecha = document.getElementById("ptFecha").value || todayStr();
  if(seleccionados.length===0 && !libre){ alert("Selecciona al menos una persona, o escribe a quién aplica (ej. Toda la tienda)."); return; }
  if(!contexto){ alert("Describe brevemente la situación."); return; }
  const responsables = seleccionados.length ? seleccionados.map(p=>p.nombre).join(", ") : libre;

  closeModal();
  openModal(`<div style="padding:30px 20px;text-align:center;"><span class="loader"></span> Redactando el Plan de Trabajo con IA...</div>`);

  const sistema = "Eres un asistente de gestión de tienda retail en Colombia. A partir del contexto de una situación, redactas el contenido de un formato oficial 'Plan de Trabajo' para dejar constancia por escrito de compromisos entre jefatura y colaborador(es). Responde ÚNICAMENTE con un JSON con las claves: planTrabajo (string, hasta 90 palabras, describe el plan a seguir de forma clara y profesional, en tono constructivo, sin ser punitivo), compromisos (array de hasta 6 objetos {texto, fecha}, cada texto una tarea concreta y accionable de máximo 12 palabras, fecha en formato DD/MM/AAAA con una fecha razonable de cumplimiento a partir de la fecha del plan), responsabilidadesJefe (array de hasta 6 objetos {texto, fecha}, compromisos de acompañamiento/capacitación de parte de jefatura, mismo formato), comentario (string, hasta 40 palabras, contexto adicional relevante; cadena vacía si no aplica), compromisosTrabajador (string, hasta 60 palabras, redactado en primera persona como si lo dijera el propio trabajador aceptando el plan). No inventes cifras ni fechas anteriores a la fecha del plan.";
  const prompt = `Responsable(s) del plan: ${responsables}\nFecha del plan: ${fmtDate(fecha)}\nSituación / contexto: ${contexto}\n\nGenera el JSON solicitado.`;

  try{
    const text = await callClaudeConReintento(prompt, sistema);
    const json = extractJson(text);
    closeModal();
    abrirRevisionPlanTrabajo({
      responsables, fecha, contexto,
      planTrabajo: json.planTrabajo || "",
      compromisos: Array.isArray(json.compromisos) ? json.compromisos.slice(0,7) : [],
      responsabilidadesJefe: Array.isArray(json.responsabilidadesJefe) ? json.responsabilidadesJefe.slice(0,7) : [],
      comentario: json.comentario || "",
      compromisosTrabajador: json.compromisosTrabajador || "",
    });
  }catch(err){
    closeModal();
    alert("No se pudo generar el Plan de Trabajo: " + err.message);
  }
}
